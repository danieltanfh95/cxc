  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  // Fills the stage. applyShapeView() sets the viewBox from the camera once
  // the svg is mounted and has a size.
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', '100%');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.dataset.shapeView = '1';
  svg.dataset.contentX = contentX;
  svg.dataset.contentY = contentY;
  svg.dataset.contentW = W;
  svg.dataset.contentH = H;
  const contentKey = `${Math.round(contentX)},${Math.round(contentY)},${Math.round(W)},${Math.round(H)}`;
  if (_shapeViewFor !== contentKey) { _shapeView = null; _shapeViewFor = contentKey; }

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = `
    <marker id="shape-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L11,6 L0,11 z" class="mk-ink"></path>
    </marker>
    <marker id="shape-arrow-sync" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L11,6 L0,11 z" class="mk-indigo"></path>
    </marker>
    <marker id="shape-arrow-start" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,1 L11,6 L0,11 z" class="mk-ink"></path>
    </marker>
    <marker id="shape-arrow-start-sync" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,1 L11,6 L0,11 z" class="mk-indigo"></path>
    </marker>
    <marker id="shape-arrow-self" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L10,5.5 L0,10 z" class="mk-rust"></path>
    </marker>
  `;
  svg.appendChild(defs);

  // childrenOf and mainNodeId drive the box styling (isContainer, isOwner).
  // There are no layer bands, because a second kind of enclosing region
  // would compete with the ownership boxes as a grouping cue.
  const childrenOf = new Map();
  for (const [child, parent] of ownerOf) {
    if (!childrenOf.has(parent)) childrenOf.set(parent, []);
    childrenOf.get(parent).push(child);
  }
  const mainNodeId = (nodes.find(n => n.shape && n.shape.name === _shape?.main_atom) || {}).id;

  const edgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  // Orthogonal route with small fixed-radius corners. The radius is capped
  // at half of each adjacent segment, so short jogs stay sharp and the path
  // stays within about r of ELK's route.
  // Obstacles for the fallback label search. Pills paint over edges, so a
  // label under one would be hidden. Containers are left out because their
  // box covers the whole subtree and would block every position inside it.
  const blockRects = [...pos.entries()]
    .filter(([id]) => id.endsWith('__self') || !childrenOf.has(id))
    .map(([, b]) => ({ x: b.x - 4, y: b.y - 4, w: b.w + 8, h: b.h + 8 }));
  // Labels placed so far. The fallback search rejects positions that overlap
  // them, and the headless dump reports them.
  const placedLabels = [];
  function rectsOverlap(a, b) {
    return !(a.x + a.w < b.x || b.x + b.w < a.x || a.y + a.h < b.y || b.y + b.h < a.y);
  }
  function pointInAnyBlock(x, y) {
    return blockRects.some(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  }
  function labelRectClears(cx, cy, w, h) {
    const rect = { x: cx - w/2, y: cy - h/2, w, h };
    // Reject if inside any block, or overlaps a previously-placed label.
    const corners = [
      [rect.x, rect.y], [rect.x + w, rect.y],
      [rect.x, rect.y + h], [rect.x + w, rect.y + h],
      [cx, cy],
    ];
    if (corners.some(([x, y]) => pointInAnyBlock(x, y))) return false;
    if (placedLabels.some(pl => rectsOverlap(rect, pl))) return false;
    return true;
  }
  function bestLabelAnchor(pts) {
    let best = { x: pts[0].x, y: pts[0].y, len: 0 };
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy);
      if (len > best.len) best = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, len };
    }
    return best;
  }
  const dirSummary = (d) => {
    const msgList = [...d.msgs.entries()].sort((a, b) => b[1] - a[1]);
    return `${d.src} → ${d.dst}\n${d.total} messages (${d.sync} sync)\n\n`
      + msgList.slice(0, 8).map(([m, c]) => `${m} × ${c}`).join('\n')
      + (msgList.length > 8 ? `\n… +${msgList.length - 8} more` : '');
  };
  for (const layoutEdge of layoutEdges) {
    const link = linkOf.get(layoutEdge.src + '|' + layoutEdge.dst);
    if (!link) continue;
    if (!layoutEdge.points || !layoutEdge.points.length) continue;
    const { e, rev } = link;
    const dirs = rev ? [e, rev] : [e];
    const pts = layoutEdge.points;
    // "sync only" means every message on the line, in both directions.
    const isSync = dirs.every(d => d.total > 0 && d.sync === d.total);
    const isSelfLoop = e.src === e.dst;
    const path = pointsToPath(pts);
    const edgeId = `edge-${e.src}--${e.dst}`.replace(/[^a-zA-Z0-9-]/g, '_');
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', path);
    p.setAttribute('class', 'shape-edge' + (isSelfLoop ? ' self' : isSync ? ' sync' : ''));
    p.setAttribute('marker-end', isSelfLoop ? 'url(#shape-arrow-self)' : isSync ? 'url(#shape-arrow-sync)' : 'url(#shape-arrow)');
    if (rev) p.setAttribute('marker-start', isSync ? 'url(#shape-arrow-start-sync)' : 'url(#shape-arrow-start)');
    p.dataset.src = e.src;
    p.dataset.dst = e.dst;
    p.dataset.edgeId = edgeId;
    const plusHint = dirs.some(d => d.msgs.size > 1)
      ? `\n\n"+N" on a label = N more message names in that direction` : '';
    p.innerHTML = `<title>${dirs.map(dirSummary).join('\n\n')}${plusHint}</title>`;
    p.style.cursor = 'pointer';
    // Transparent fat hit-path underneath the visible stroke. At 1.1px the
    // visible stroke is too thin for a reliable hover target. The hit path
    // renders behind the visible one with the same `d`, a 14-unit transparent
    // stroke, and routes events to the same handlers.
    const pHit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pHit.setAttribute('d', path);
    pHit.setAttribute('class', 'shape-edge-hit');
    pHit.setAttribute('fill', 'none');
    pHit.setAttribute('stroke', 'transparent');
    pHit.setAttribute('stroke-width', '14');
    pHit.setAttribute('pointer-events', 'stroke');
    pHit.style.cursor = 'pointer';
    pHit.dataset.edgeId = edgeId;
    pHit.addEventListener('click', () => showEdgeDetail(e, rev));
    edgeG.appendChild(pHit);
    edgeG.appendChild(p);
    const highlightPair = (on) => {
      const q = `[data-edge-id="${edgeId}"]`;
      svg.querySelectorAll(q).forEach(el => {
        if (on) el.classList.add('shape-edge-hover');
        else    el.classList.remove('shape-edge-hover');
      });
    };
    const onEnter = () => { highlightPair(true); highlightShape([e.src, e.dst]); };
    const onLeave = () => { highlightPair(false); highlightShape(null); };
    pHit.addEventListener('mouseenter', onEnter);
    pHit.addEventListener('mouseleave', onLeave);
    p.addEventListener('mouseenter', onEnter);
    p.addEventListener('mouseleave', onLeave);
    p.addEventListener('click', () => showEdgeDetail(e, rev));

    dirs.forEach((d, i) => {
      // ELK positions the label. The polyline search below only runs if ELK
      // returned a label without a position.
      const base = edgeLabelText(d);
      const textW = edgeLabelWidth(rev ? '▼ ' + base : base);
      const textH = 16;
      const lab = layoutEdge.labels[i];
      let anchor = null;
      let found = false;
      if (lab) {
        anchor = { x: lab.x + lab.w / 2, y: lab.y + 9 };
        found = true;
      }
      const candidates = [];
      if (!found) {
        candidates.push(bestLabelAnchor(pts));
        for (let k = 1; k < pts.length; k++) {
          const a = pts[k - 1], b = pts[k];
          for (const t of [0.5, 0.25, 0.75, 0.15, 0.85]) {
            candidates.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
          }
        }
        anchor = candidates[0];
        for (const cand of candidates) {
          if (labelRectClears(cand.x, cand.y, textW, textH)) { anchor = cand; found = true; break; }
        }
      }
      if (!found) {
        outer: for (const cand of candidates) {
          for (const dy of [-12, 12, -24, 24, -36, 36]) {
            if (labelRectClears(cand.x, cand.y + dy, textW, textH)) {
              anchor = { x: cand.x, y: cand.y + dy }; break outer;
            }
          }
        }
      }
      let lbl = base;
      if (rev) {
        const g = travelGlyph(pts, anchor.x, anchor.y - 1);
        lbl = (i === 0 ? g : flipGlyph[g]) + ' ' + base;
      }
      placedLabels.push({ x: anchor.x - textW/2, y: anchor.y - 9, w: textW, h: textH, edgeId, text: lbl, kind: isSelfLoop ? 'self' : 'edge' });
      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('x', anchor.x - textW / 2);
      bg.setAttribute('y', anchor.y - 9);
      bg.setAttribute('width', textW);
      bg.setAttribute('height', textH);
      bg.setAttribute('rx', 3);
      bg.setAttribute('class', 'shape-edge-label-bg');
      bg.dataset.edgeId = edgeId;
      bg.innerHTML = `<title>${dirSummary(d)}</title>`;
      bg.addEventListener('mouseenter', () => highlightPair(true));
      bg.addEventListener('mouseleave', () => highlightPair(false));
      edgeG.appendChild(bg);
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', anchor.x);
      t.setAttribute('y', anchor.y + 3);
      t.setAttribute('class', 'shape-edge-label');
      t.setAttribute('text-anchor', 'middle');
      t.dataset.edgeId = edgeId;
      t.textContent = lbl;
      edgeG.appendChild(t);
    });
  }

  // Container boxes with a self-pill are drawn under the edges and ignore the
  // pointer, because the pill inside handles the atom's name, clicks and
  // hover. Edges and labels inside a box stay clickable, and dragging on
  // empty space inside it pans.
  const containerG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  svg.appendChild(containerG);
  svg.appendChild(edgeG);

  // Blocks. When shape is loaded, each block reads as a source card:
  //   name (bold) · <M phases, N transitions> · one row per container field.
  // Container fields render as pills ("hand: List of Card") inside the block
  // so the topology graph doesn't split them out as sibling atoms. Clicking
  // a block expands its phase graph in the detail pane.
  const blockG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  for (const n of nodes) {
    const p = pos.get(n.id);
    if (!p) continue;
    const isMain = n.cls === 'CxcMain' || (n.shape && n.shape.name === _shape?.main_atom);
    // Selection may be seeded either as the node id (from a click) or as the
    // atom name (from `?expand=…`). Match both so URL-seeded selection lights
    // up the halo without needing a click.
    const isSelected = selectedNode === n.id || (n.shape && selectedNode === n.shape.name);
    // Dim unrelated blocks whenever a phase graph is open so the reader
    // sees the topology → detail relationship at a glance.
    const dimForSelection = selectedNode && !isSelected && n.id !== '(root)';
    const isOwner = childrenOf.has(n.id) && n.id !== mainNodeId;
    // isContainer: owns children in the ELK-compound hierarchy.
    // Main is always a container (it wraps everything else).
    const isContainer = childrenOf.has(n.id) || isMain;
    // With a self-pill, the container is only a region (see containerG).
    const hasSelfPill = isContainer && pos.has(n.id + '__self');
    const clsAttr = 'shape-block' +
      (n.id === '(root)' ? ' root' : '') +
      (isMain ? ' main' : '') +
      (isOwner ? ' owner' : '') +
      (isContainer ? ' container' : '') +
      (isSelected ? ' selected' : '') +
      (dimForSelection ? ' dim-when-selected' : '');
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', p.x); rect.setAttribute('y', p.y);
    rect.setAttribute('width', p.w); rect.setAttribute('height', p.h);
    rect.setAttribute('rx', 5);
    rect.setAttribute('class', clsAttr);
    rect.dataset.nodeId = n.id;
    rect.dataset.nodeName = (n.shape && n.shape.name) || n.cls || n.id;
    // Selection halo — soft wash rect painted behind the block, plus the
    // block rect re-appended at the end so it paints above neighbors.
    if (isSelected) {
      const pad = 6;
      const glow = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      glow.setAttribute('x', p.x - pad); glow.setAttribute('y', p.y - pad);
      glow.setAttribute('width', p.w + pad*2); glow.setAttribute('height', p.h + pad*2);
      glow.setAttribute('rx', 10);
      glow.setAttribute('class', 'shape-block-halo-outer');
      (hasSelfPill ? containerG : blockG).appendChild(glow);
    }
    if (hasSelfPill) {
      rect.style.pointerEvents = 'none';
      containerG.appendChild(rect);
      continue;
    }
    rect.addEventListener('click', () => {
      selectedNode = selectedNode === n.id ? null : n.id;
      _expandedAtom = n.shape ? n.shape.name : null;
      showNodeDetail(n, edges);
      renderShape();
    });
    rect.addEventListener('mouseenter', () => highlightShape(n.id));
    rect.addEventListener('mouseleave', () => highlightShape(null));
    rect.innerHTML = `<title>${n.shape ? n.shape.name : n.id}\n${n.size} trace events</title>`;
    blockG.appendChild(rect);

    // Title line — atom name. Container titles sit in a folder-style tab
    // above the container border; leaf titles keep their original centered
    // placement inside the pill.
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', isContainer ? p.x + 14 : p.cx);
    label.setAttribute('y', isContainer ? p.y - 19 : p.y + 24);
    label.setAttribute('class', 'shape-block-label' + (isContainer ? ' container' : '') + (isMain ? ' main' : ''));
    label.textContent = n.id === '(root)' ? 'init' : n.label;

    if (n.id === '(root)') {
      blockG.appendChild(label);
      continue;
    }

    // Subtitle — shape summary or bare event count
    const sub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    sub.setAttribute('x', isContainer ? p.x + 14 : p.cx);
    sub.setAttribute('y', isContainer ? p.y - 19 : p.y + 42);
    sub.setAttribute('class', 'shape-block-sub' + (isContainer ? ' container' : '') + (isMain ? ' main' : ''));
    if (n.shape) {
      const nPhases = n.shape.phases.length;
      const nTxns = n.shape.transitions.length + n.shape.self_transitions.length;
      sub.textContent = `${nPhases} phases · ${nTxns} arms`;
    } else {
      sub.textContent = n.size + ' events';
    }

    if (isContainer) {
      // Overshoot the actual char widths so the tab has real padding
      // instead of touching the label glyphs. 16px bold ~= 10px/char,
      // 12px regular ~= 7px/char, plus a 20px gutter between the two
      // runs and 14px padding at each end.
      const labelW = label.textContent.length * 10;
      const subW = sub.textContent.length * 7;
      const tabW = Math.max(200, Math.ceil(labelW + subW + 48));
      const tab = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      // Push the tab 12px above the container border (was 4) so the two
      // rects don't visually merge into one thick line.
      tab.setAttribute('x', p.x); tab.setAttribute('y', p.y - 38);
      tab.setAttribute('width', tabW); tab.setAttribute('height', 26);
      tab.setAttribute('rx', 5);
      // The tab branch only fires for main atoms with no children; every
      // compound hits the self-pill continue path above.
      tab.setAttribute('class', 'shape-container-tab container main' + (isSelected ? ' selected' : ''));
      // Tab shares the container's click / hover contract: clicking opens
      // its phase graph, hovering lights up the container + descendants.
      tab.addEventListener('mouseenter', () => highlightShape(n.id));
      tab.addEventListener('mouseleave', () => highlightShape(null));
      tab.addEventListener('click', () => {
        selectedNode = selectedNode === n.id ? null : n.id;
        _expandedAtom = n.shape ? n.shape.name : null;
        showNodeDetail(n, edges);
        renderShape();
      });
      sub.setAttribute('x', p.x + tabW - 14);
      sub.setAttribute('text-anchor', 'end');
      blockG.appendChild(tab);
    }
    blockG.appendChild(label);
    blockG.appendChild(sub);

    // Compact fields badge — one strip inside the block. Skipped for
    // ELK containers because the strip would obstruct the child pills
    // that sit inside the container's own bounds.
    if (n.shape && !isContainer) {
      const containerFields = n.shape.fields.filter(f => f.container_kind);
      const nContainers = containerFields.length;
      const nAtomLinks = n.shape.fields.filter(f => nodes.some(nn => nn.shape && nn.shape.name === f.type)).length;
      const nOther = n.shape.fields.length - nContainers - nAtomLinks;
      if (n.shape.fields.length > 0) {
        const badgeW = p.w - 20;
        const badgeX = p.x + 10;
        const badgeY = p.y + 52;
        const badge = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        badge.setAttribute('x', badgeX); badge.setAttribute('y', badgeY);
        badge.setAttribute('width', badgeW); badge.setAttribute('height', 16);
        badge.setAttribute('rx', 3);
        badge.setAttribute('class', 'shape-block-badge');
        blockG.appendChild(badge);
        const bt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        bt.setAttribute('x', badgeX + badgeW / 2);
        bt.setAttribute('y', badgeY + 12);
        bt.setAttribute('class', 'shape-block-badge-label');
        // Compact form: "N fields (M refs)". Refs = containers + direct
        // atom-typed fields — the hover-highlightable subset. Tooltip
        // spells out the breakdown; the visual stays block-wide-safe.
        const nFields = n.shape.fields.length;
        const nRefs = nContainers + nAtomLinks;
        bt.textContent = nRefs > 0
          ? `${nFields} field${nFields > 1 ? 's' : ''} · ${nRefs} ref${nRefs > 1 ? 's' : ''}`
          : `${nFields} field${nFields > 1 ? 's' : ''}`;
        const tip = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        tip.textContent = [
          nContainers ? `${nContainers} container field${nContainers > 1 ? 's' : ''}` : null,
          nAtomLinks  ? `${nAtomLinks} atom-typed field${nAtomLinks > 1 ? 's' : ''}` : null,
          nOther      ? `${nOther} scalar field${nOther > 1 ? 's' : ''}` : null,
        ].filter(Boolean).join(' · ');
        badge.appendChild(tip);
        blockG.appendChild(bt);
        // Hover on badge highlights every atom this block references via
        // its List-of / Set-of / atom-typed fields.
        const linkedIds = new Set([n.id]);
        for (const f of n.shape.fields) {
          const inner = /^(?:List|Set) of (.+)$/.exec(f.type);
          const targetName = inner ? inner[1] : f.type;
          const target = nodes.find(nn => nn.shape && nn.shape.name === targetName);
          if (target) linkedIds.add(target.id);
        }
        if (linkedIds.size > 1) {
          badge.style.cursor = 'pointer';
          badge.addEventListener('mouseenter', () => highlightShape([...linkedIds]));
          badge.addEventListener('mouseleave', () => highlightShape(null));
        }
      }
    }
  }
  // Self-pills: each compound's own atom, drawn as a full atom card (name,
  // phase and arm counts) that handles clicks and hover for the atom.
  const nodeById = new Map(nodes.map(n => [n.id, n]));
  for (const [id, p] of pos.entries()) {
    if (!id.endsWith('__self')) continue;
    const parentId = id.slice(0, -'__self'.length);
    const parent = nodeById.get(parentId);
    if (!parent) continue;
    const isMain = parent.cls === 'CxcMain' || (parent.shape && parent.shape.name === _shape?.main_atom);
    const isSelected = selectedNode === parentId || (parent.shape && selectedNode === parent.shape.name);
    const dimForSelection = selectedNode && !isSelected;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', p.x); rect.setAttribute('y', p.y);
    rect.setAttribute('width', p.w); rect.setAttribute('height', p.h);
    rect.setAttribute('rx', 5);
    rect.setAttribute('class', 'shape-block' +
      (isMain ? ' main' : '') +
      (isSelected ? ' selected' : '') +
      (dimForSelection ? ' dim-when-selected' : ''));
    rect.dataset.nodeId = parentId;
    rect.dataset.nodeName = (parent.shape && parent.shape.name) || parent.cls || parentId;
    rect.addEventListener('click', () => {
      selectedNode = selectedNode === parentId ? null : parentId;
      _expandedAtom = parent.shape ? parent.shape.name : null;
      showNodeDetail(parent, edges);
      renderShape();
    });
    rect.addEventListener('mouseenter', () => highlightShape(parentId));
    rect.addEventListener('mouseleave', () => highlightShape(null));
    rect.innerHTML = `<title>${parent.shape ? parent.shape.name : parentId}\n${parent.size} trace events</title>`;
    g.appendChild(rect);
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', p.cx);
    label.setAttribute('y', p.y + 24);
    label.setAttribute('class', 'shape-block-label' + (isMain ? ' on-pastel' : ''));
    label.textContent = parent.label;
    g.appendChild(label);
    const sub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    sub.setAttribute('x', p.cx);
    sub.setAttribute('y', p.y + 42);
    sub.setAttribute('class', 'shape-block-sub' + (isMain ? ' on-pastel' : ''));
    if (parent.shape) {
      const nPhases = parent.shape.phases.length;
      const nTxns = parent.shape.transitions.length + parent.shape.self_transitions.length;
      sub.textContent = `${nPhases} phases · ${nTxns} arms`;
    } else {
      sub.textContent = parent.size + ' events';
    }
    g.appendChild(sub);
    blockG.appendChild(g);
  }
  svg.appendChild(blockG);
  stage.appendChild(svg);
  applyShapeView();

  // Headless-only geometry dump for tools/layout-metrics.py, in the SVG user
  // space the paths and rects are drawn in.
  if (_elkSyncMode) {
    const dbg = {
      nodes: [...pos.entries()].map(([id, p]) => ({
        id, x: p.x, y: p.y, w: p.w, h: p.h,
        parent: parentOf.get(id) || null,
        kind: id.endsWith('__self') ? 'self' : (childrenOf.has(id) ? 'container' : 'leaf'),
      })),
      edges: layoutEdges.map(le => ({
        src: le.src, dst: le.dst, elkSrc: le.elkSrc, elkDst: le.elkDst,
        points: le.points.map(q => [q.x, q.y]),
      })),
      labels: placedLabels,
      view: { stageW: svg.clientWidth, stageH: svg.clientHeight, scale: _shapeView ? _shapeView.scale : null, fit: shapeFitScale(svg) },
    };
    let el = document.getElementById('layout-debug');
    if (!el) {
      el = document.createElement('script');
      el.type = 'application/json';
      el.id = 'layout-debug';
      document.body.appendChild(el);
    }
    el.textContent = JSON.stringify(dbg);
  }

  // If a block is selected, render its phase graph in the detail pane and
  // scroll the topology so the selected node sits in view — otherwise the
  // "which atom is this?" question is answered only by the panel header.
  if (_expandedAtom && _shape) {
    const atomShape = _shape.atoms.find(a => a.name === _expandedAtom);
    if (atomShape) renderPhaseGraph(atomShape);
    if (selectedNode) {
      // Selection may be a node id (from click) or an atom name (from ?expand).
      // Try id first, then walk nodes for the atom-name match.
      let selEl = stage.querySelector(`.shape-block[data-node-id="${CSS.escape(selectedNode)}"]`);
      if (!selEl) {
        const atomNode = nodes.find(nn => nn.shape && nn.shape.name === selectedNode);
        if (atomNode) selEl = stage.querySelector(`.shape-block[data-node-id="${CSS.escape(atomNode.id)}"]`);
      }
      // The svg fills the stage, so scrollIntoView can't move it. Centre the
      // camera on the pill instead when it is out of view.
      const selId = selEl && selEl.dataset.nodeId;
      const sp = selId && pos.get(selId + '__self') || (selId && pos.get(selId));
      if (sp && _shapeView) {
        const vw = svg.clientWidth / _shapeView.scale, vh = svg.clientHeight / _shapeView.scale;
        const inView = sp.x >= _shapeView.cx - vw / 2 && sp.x + sp.w <= _shapeView.cx + vw / 2
                    && sp.y >= _shapeView.cy - vh / 2 && sp.y + sp.h <= _shapeView.cy + vh / 2;
        if (!inView) { _shapeView.cx = sp.cx; _shapeView.cy = sp.cy; applyShapeView(); }
      }
    }
  }
  _mountTransport();
}

function highlightShape(hoverIds) {
  const stage = $('stage-main');
  if (!stage) return;
  const svg = stage.querySelector('svg');
  if (!svg) return;
  // Playthrough halos read as "active"; don't let a hover sweep nuke them.
  svg.querySelectorAll('.shape-block').forEach(el => el.classList.remove('dim', 'hover'));
  svg.querySelectorAll('.shape-edge').forEach(el => el.classList.remove('dim'));
  if (!hoverIds) return;
  const set = new Set(Array.isArray(hoverIds) ? hoverIds : [hoverIds]);
  svg.querySelectorAll('.shape-block').forEach(el => {
    if (set.has(el.dataset.nodeId)) el.classList.add('hover');
    else el.classList.add('dim');
  });
  svg.querySelectorAll('.shape-edge').forEach(el => {
    if (!set.has(el.dataset.src) && !set.has(el.dataset.dst)) el.classList.add('dim');
  });
}


// ===== PLAYTHROUGH =====
// Reuses the shape layout and animates runtime events on top. Source +
// destination atoms pulse per send/arm; the matching shape edge flashes.
// Transport bar offers play/pause, step, scrubber, speed. Scrubber is a
// seek, not a replay — no history recomputation needed.
let _ptState = null;
function _ptStop() {
  if (!_ptState) return;
  if (_ptState.rafId) cancelAnimationFrame(_ptState.rafId);
  _ptState = null;
}
function _ptSvg(){ return $('stage-main').querySelector('svg'); }
function _ptClearFlashes() {
  const svg = _ptSvg(); if (!svg) return;
  svg.querySelectorAll('.pt-flash-src,.pt-flash-dst').forEach(el => el.classList.remove('pt-flash-src','pt-flash-dst'));
  svg.querySelectorAll('.pt-flash').forEach(el => el.classList.remove('pt-flash'));
  svg.querySelectorAll('.pt-dot').forEach(el => el.remove());
}
function _ptFlashEvent(e, forward) {
  const svg = _ptSvg(); if (!svg) return;
  const srcId = e._inferredSenderCls || null;
  const dstId = e.target_cls || null;
  const srcEl = srcId ? svg.querySelector(`.shape-block[data-node-id="${CSS.escape(srcId)}"]`) : null;
  const dstEl = dstId ? svg.querySelector(`.shape-block[data-node-id="${CSS.escape(dstId)}"]`) : null;
  const edgeEl = (srcId && dstId) ? svg.querySelector(`.shape-edge[data-src="${CSS.escape(srcId)}"][data-dst="${CSS.escape(dstId)}"]`) : null;
  if (srcEl) srcEl.classList.add('pt-flash-src');
  if (dstEl) dstEl.classList.add('pt-flash-dst');
  if (edgeEl) edgeEl.classList.add('pt-flash');
  // Travelling dot along the edge path. Only if we found the path and we're
  // moving forward (so scrubbing doesn't spam dots).
  if (edgeEl && forward) {
    const total = edgeEl.getTotalLength();
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('r', 4);
    dot.setAttribute('class', 'pt-dot');
    edgeEl.parentNode.appendChild(dot);
    const t0 = performance.now();
    const dur = Math.max(220, Math.min(600, total * 0.9));
    const step = (now) => {
      const t = (now - t0) / dur;
      if (t >= 1 || !_ptState) { dot.remove(); return; }
      const pt = edgeEl.getPointAtLength(t * total);
      dot.setAttribute('cx', pt.x);
      dot.setAttribute('cy', pt.y);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  // Decay the atom halos.
  setTimeout(() => {
    if (srcEl) srcEl.classList.remove('pt-flash-src');
    if (dstEl) dstEl.classList.remove('pt-flash-dst');
    if (edgeEl) edgeEl.classList.remove('pt-flash');
  }, 280);
}
function _ptSetStatus() {
  if (!_ptState) return;
  const total = filtered.length;
  const i = _ptState.idx;
  const e = filtered[i] || filtered[filtered.length-1];
  const seq = e ? e.seq : '?';
  const msg = e ? (e.msg || '') : '';
  $('pt-status').innerHTML = `<b>seq ${seq}</b> · ${escapeHtml(msg)}<span class="pt-count">(${i+1}/${total})</span>`;
  $('pt-scrub').value = String(i);
}
function _ptAdvanceOne(forward) {
  if (!_ptState) return;
  const i = _ptState.idx;
  if (i < 0 || i >= filtered.length) return;
  const e = filtered[i];
  const kind = e.kind;
  if (kind === 'send' || kind === 'send_sync' || kind === 'arm' || kind === 'no_arm') {
    _ptFlashEvent(e, forward);
  }
  _ptSetStatus();
}
function _ptPlayTick(now) {
  if (!_ptState || _ptState.paused) return;
  const dt = now - _ptState.lastTick;
  const stepInterval = 1000 / (60 * _ptState.speed); // 60 ev/s at 1x
  if (dt >= stepInterval) {
    const nSteps = Math.max(1, Math.floor(dt / stepInterval));
    for (let k = 0; k < nSteps; k++) {
      if (_ptState.idx >= filtered.length - 1) { _ptPause(); break; }
      _ptState.idx++;
      _ptAdvanceOne(true);
    }
    _ptState.lastTick = now;
  }
  _ptState.rafId = requestAnimationFrame(_ptPlayTick);
}
function _ptPlay() {
  if (!_ptState) return;
  if (_ptState.idx >= filtered.length - 1) _ptState.idx = 0;
  _ptState.paused = false;
  _ptState.lastTick = performance.now();
  $('pt-play').textContent = 'pause';
  _ptState.rafId = requestAnimationFrame(_ptPlayTick);
}
function _ptPause() {
  if (!_ptState) return;
  _ptState.paused = true;
  if (_ptState.rafId) cancelAnimationFrame(_ptState.rafId);
  $('pt-play').textContent = 'play';
}
function _mountTransport() {
  _ptStop();
  if (!filtered.length) return;
  _ptState = { idx: 0, paused: true, speed: 1, rafId: null, lastTick: 0 };
  const stage = $('stage-main');
  const bar = document.createElement('div');
  bar.id = 'pt-transport';
  bar.innerHTML = `
    <button id="pt-rewind" title="jump to start">⏮</button>
    <button id="pt-step-back" title="step back one event">←</button>
    <button id="pt-play" title="play / pause">play</button>
    <button id="pt-step-fwd" title="step forward one event">→</button>
    <input type="range" id="pt-scrub" min="0" max="${Math.max(0, filtered.length-1)}" value="0">
    <select id="pt-speed">
      <option value="1">1×</option>
      <option value="5">5×</option>
      <option value="20">20×</option>
      <option value="100">100×</option>
    </select>
    <span id="pt-status"></span>`;
  stage.appendChild(bar);
  _ptSetStatus();
  $('pt-play').addEventListener('click', () => _ptState?.paused ? _ptPlay() : _ptPause());
  $('pt-rewind').addEventListener('click', () => { _ptPause(); _ptState.idx = 0; _ptClearFlashes(); _ptSetStatus(); });
  $('pt-step-fwd').addEventListener('click', () => {
    _ptPause();
    if (_ptState.idx < filtered.length - 1) { _ptState.idx++; _ptAdvanceOne(true); }
  });
  $('pt-step-back').addEventListener('click', () => {
    _ptPause();
    if (_ptState.idx > 0) { _ptState.idx--; _ptAdvanceOne(false); }
  });
  $('pt-scrub').addEventListener('input', (e) => {
    _ptPause();
    _ptState.idx = parseInt(e.target.value, 10) || 0;
    _ptClearFlashes();
    _ptAdvanceOne(false);
  });
  $('pt-speed').addEventListener('change', (e) => {
    _ptState.speed = parseFloat(e.target.value) || 1;
  });
}

function render() {
  if (events.length) renderShape();
}

window.addEventListener('keydown', (e) => {
  if (e.key !== ' ') return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (!_ptState) return;
  e.preventDefault();
  _ptState.paused ? _ptPlay() : _ptPause();
});

$('shape-orient').addEventListener('change', render);
$('shape-expand').addEventListener('change', render);
$('shape-show-containers').addEventListener('change', render);
const shapeShowInit = $('shape-show-init');
shapeShowInit.checked = localStorage.getItem('cxc-shape-show-init') === '1';
shapeShowInit.addEventListener('change', () => {
  localStorage.setItem('cxc-shape-show-init', shapeShowInit.checked ? '1' : '0');
  renderShape();
});
$('seq-range').addEventListener('input', applyFilters);
window.addEventListener('resize', () => render());

// Drop wiring
const drop = $('drop');
drop.addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (f) f.text().then(t => loadTrace(t, f.name));
});
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('hover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
drop.addEventListener('drop', (e) => {
  e.preventDefault();
  drop.classList.remove('hover');
  const f = e.dataTransfer.files[0];
  if (f) f.text().then(t => loadTrace(t, f.name));
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) f.text().then(t => loadTrace(t, f.name));
});

const params = _traceViewerParams;
if (params.get('shape-orient')) $('shape-orient').value = params.get('shape-orient');
if (params.get('shape-expand') === '1') $('shape-expand').checked = true;
if (params.get('shape-show-containers') === '1') $('shape-show-containers').checked = true;
// Chrome-free screenshot modes for embedding in compare.html and similar
// panels. hide-sidebar drops only the sidebar; hide-chrome also drops the
// header, toolbar, and onboarding hint. Pure visual knobs; interactions
// still work on whatever remains.
if (params.get('hide-sidebar') === '1') document.body.classList.add('sidebar-collapsed');
if (params.get('hide-chrome') === '1') document.body.classList.add('hide-chrome');
// `?expand=<atom-name>` opens the phase graph for that atom on load — useful
// for screenshots, bookmarks, and deep-linking a specific lifecycle. When set
// we also seed `selectedNode` so the topology halo lights up; loadShape's
// render pass resolves the node id via the atom-name match.
const expandParam = params.get('expand');
if (expandParam) { _expandedAtom = expandParam; selectedNode = expandParam; }

// Try to load a companion shape sidecar. Precedence:
//   1. explicit ?shape=<path> — user pins a specific sidecar
//   2. derived from the trace path — swap `.trace.jsonl`/`.jsonl` for
//      `.shape.json`; matches the cxc build output layout
//   3. `<trace-basename>.shape.json` — for `.current-trace.jsonl` etc.
// A 404 is fine — the viewer degrades to Phase 1 topology inference.
function deriveShapePath(tracePath) {
  if (!tracePath) return null;
  if (tracePath.endsWith('.trace.jsonl')) return tracePath.replace(/\.trace\.jsonl$/, '.shape.json');
  if (tracePath.endsWith('.jsonl'))       return tracePath.replace(/\.jsonl$/, '.shape.json');
  return tracePath + '.shape.json';
}
function loadShape(url) {
  return fetch(url, {cache: 'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(j => { _shape = j; if (j) { $('status').textContent += ` · shape: ${j.atoms.length} atoms`; } render(); })
    .catch(() => { _shape = null; });
}
if (params.has('trace')) {
  const tp = params.get('trace');
  fetch(tp).then(r => r.text()).then(t => {
    loadTrace(t, tp);
    const shapeUrl = params.get('shape') || deriveShapePath(tp);
    if (shapeUrl) loadShape(shapeUrl);
  });
}

// Draggable splitter between #stage-main and #stage-detail. Only usable
// while the phase panel is open (splitter is display:none otherwise).
// Persists user-chosen height to localStorage so the pane stays where the
// user left it across reloads. Double-click resets to the CSS default.
(function wireSplitter() {
  const splitter = document.getElementById('stage-splitter');
  const detail = document.getElementById('stage-detail');
  if (!splitter || !detail) return;
  // Restore persisted height on open.
  const saved = localStorage.getItem('cxc-phase-pane-h');
  if (saved) detail.style.height = saved + 'px';
  let dragging = false;
  splitter.addEventListener('mousedown', (e) => {
    if (!document.body.classList.contains('phase-panel-open')) return;
    dragging = true;
    splitter.classList.add('dragging');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const wh = window.innerHeight;
    const newH = Math.max(200, Math.min(wh - 120, wh - e.clientY - 3));
    detail.style.height = newH + 'px';
    localStorage.setItem('cxc-phase-pane-h', String(newH));
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
  splitter.addEventListener('dblclick', () => {
    detail.style.height = '';   // fall back to CSS default
    localStorage.removeItem('cxc-phase-pane-h');
  });
})();

// Wheel over the shape view pans on a plain scroll (trackpads give both
// axes, and shift+wheel scrolls sideways on a mouse) and zooms at the cursor
// on ctrl/⌘+scroll or a trackpad pinch, which arrives as ctrl+wheel. It is
// wired once because the zoom widget is rebuilt on every render.
(function wireShapeWheel() {
  const stage = document.getElementById('stage-main');
  if (!stage) return;
  stage.addEventListener('wheel', (ev) => {
    if (!shapeSvg() || !_shapeView) return;
    if (ev.target.closest && ev.target.closest('#shape-legend')) return;
    ev.preventDefault();
    const unit = ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? stage.clientHeight : 1;
    if (ev.ctrlKey || ev.metaKey) {
      zoomShapeAt(Math.exp(-ev.deltaY * unit * 0.0025), ev.clientX, ev.clientY);
    } else {
      _shapeView.cx += ev.deltaX * unit / _shapeView.scale;
      _shapeView.cy += ev.deltaY * unit / _shapeView.scale;
      applyShapeView();
    }
  }, { passive: false });
  // The viewBox size follows the stage size, so recompute it when the stage
  // resizes (window resize, detail-pane splitter).
  if (typeof ResizeObserver === 'function') new ResizeObserver(() => applyShapeView()).observe(stage);
})();

// Left-drag moves the camera on the shape view at any zoom, and falls back to
// scrollLeft/scrollTop on the phase-graph SVG (no data-shape-view). Interactive
// descendants (legend, zoom UI, hint, close) don't start a pan, and a drag
// under 4px passes through as a click while a longer one pans and swallows it.
(function wirePan() {
  const stage = document.getElementById('stage-main');
  if (!stage) return;
  let active = false, sx = 0, sy = 0, moved = false;
  let initSL = 0, initST = 0;
  let initCX = 0, initCY = 0;
  let viewBoxMode = false;
  const skipSel = '#shape-legend, #shape-zoom, #shape-hint, #pt-transport';
  const svgSel = () => stage.querySelector('svg');
  const swallowNextClick = (ev) => { ev.stopPropagation(); ev.preventDefault(); stage.removeEventListener('click', swallowNextClick, true); };
  stage.addEventListener('mousedown', (ev) => {
    if (ev.button !== 0) return;
    if (ev.target.closest && ev.target.closest(skipSel)) return;
    active = true; moved = false;
    sx = ev.clientX; sy = ev.clientY;
    const svgEl = svgSel();
    viewBoxMode = !!(svgEl && svgEl.dataset.shapeView && _shapeView);
    if (viewBoxMode) {
      initCX = _shapeView.cx;
      initCY = _shapeView.cy;
    } else {
      initSL = stage.scrollLeft; initST = stage.scrollTop;
    }
  });
  window.addEventListener('mousemove', (ev) => {
    if (!active) return;
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    if (!moved) { moved = true; stage.classList.add('panning'); }
    if (viewBoxMode) {
      if (!_shapeView) return;
      _shapeView.cx = initCX - dx / _shapeView.scale;
      _shapeView.cy = initCY - dy / _shapeView.scale;
      applyShapeView();
    } else {
      stage.scrollLeft = initSL - dx;
      stage.scrollTop  = initST - dy;
    }
    ev.preventDefault();
  });
  window.addEventListener('mouseup', () => {
    if (!active) return;
    const wasMoved = moved;
    active = false; moved = false;
    stage.classList.remove('panning');
    if (wasMoved) stage.addEventListener('click', swallowNextClick, true);
  });
})();

// ===== ANNOTATIONS =====
// Phase 5 wiring. State lives on disk in <trace>.annotations.json, fetched
// via GET /annotations?trace=<name> on load, written back via POST on save.
// Status badges overlay on shape atoms. Focus is POSTed on scrubber + click.

const _annState = {
  trace: _traceViewerParams.get('trace'),
  sidecar: null,
  loaded: false,
};

const STATUS_COLOR = {
  open:        '#d35a4a',
  in_progress: '#e0a040',
  addressed:   '#6ea84a',
  verified:    '#4a8a4a',
  wontfix:     '#888',
  stale:       '#aaa',
};

function annEffectiveStatus(a) { return a.status || 'open'; }

async function annLoad() {
  if (!_annState.trace) return;
  try {
    const r = await fetch('/annotations?trace=' + encodeURIComponent(_annState.trace));
    if (!r.ok) return;
    _annState.sidecar = await r.json();
    _annState.loaded = true;
    annRenderPanel();
    annRenderBadges();
  } catch (e) { /* server not up or no sidecar */ }
}

async function annSave() {
  if (!_annState.trace || !_annState.sidecar) return;
  const r = await fetch('/annotations?trace=' + encodeURIComponent(_annState.trace), {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(_annState.sidecar),
  });
  if (!r.ok) { alert('annotation save failed: ' + r.status); return false; }
  return true;
}

function annTargetBrief(t) {
  if (!t) return '';
  if (t.trace_seq != null) return 'seq=' + t.trace_seq + (t.atom ? ' atom=' + t.atom : '') + (t.msg ? ' msg=' + t.msg : '');
  if (t.trace_seq_start != null) return 'seq=' + t.trace_seq_start + '..' + t.trace_seq_end;
  if (t.from_atom && t.to_atom) return t.from_atom + '→' + t.to_atom + (t.msg ? ' via ' + t.msg : '');
  if (t.atom) return 'atom=' + t.atom + (t.phase ? ' phase=' + t.phase : '');
  return JSON.stringify(t);
}

function annRenderPanel() {
  const panel = $('annotations-panel');
  const countEl = $('annotations-count');
  if (!panel) return;
  if (!_annState.loaded) {
    panel.innerHTML = '<div style="color:var(--p-ink2); padding:4px 0">no server, run <code>cxc trace serve</code></div>';
    countEl.textContent = '';
    return;
  }
  const anns = _annState.sidecar?.annotations || [];
  countEl.textContent = anns.length ? ' (' + anns.length + ')' : '';
  if (!anns.length) {
    panel.innerHTML = '<div style="color:var(--p-ink2); padding:4px 0">none yet</div>';
    return;
  }
  const by = {open:0, in_progress:0, addressed:0, verified:0, wontfix:0, stale:0};
  for (const a of anns) by[annEffectiveStatus(a)] = (by[annEffectiveStatus(a)]||0) + 1;
  let html = '<div style="display:flex; flex-wrap:wrap; gap:4px; margin:4px 0 8px">';
  for (const [k,v] of Object.entries(by)) {
    if (!v) continue;
    html += '<span style="background:' + STATUS_COLOR[k] + '; color:#fff; padding:1px 6px; font-size:9px; letter-spacing:.1em">' + k.toUpperCase() + ' ' + v + '</span>';
  }
  html += '</div>';
  html += '<div style="max-height:280px; overflow-y:auto">';
  for (const a of anns) {
    const dot = '<span style="display:inline-block; width:7px; height:7px; background:' + STATUS_COLOR[annEffectiveStatus(a)] + '"></span>';
    html += '<div data-ann-id="' + a.id + '" class="ann-row" style="padding:4px 6px; margin:2px 0; border-left:2px solid ' + STATUS_COLOR[annEffectiveStatus(a)] + '; cursor:pointer; font-size:10px">';
    html += '<div style="display:flex; gap:4px; align-items:center">' + dot + '<b>' + a.id + '</b> <span style="color:var(--p-ink2)">' + a.severity + '</span> <span style="color:var(--p-ink2); font-size:9px">' + a.kind + '</span></div>';
    html += '<div style="color:var(--p-ink2); margin-top:2px">' + escapeHtml(a.note || '').slice(0, 90) + ((a.note||'').length > 90 ? '…' : '') + '</div>';
    html += '</div>';
  }
  html += '</div>';
  panel.innerHTML = html;
  for (const el of panel.querySelectorAll('.ann-row')) {
    el.addEventListener('click', () => {
      const id = el.dataset.annId;
      const a = (_annState.sidecar?.annotations || []).find(x => x.id === id);
      if (!a) return;
      $('stage-detail').className = '';
      $('stage-detail').innerHTML = _detailWrap(
        '<div style="font-size:11px; line-height:1.5">' +
        '<div style="font-weight:600; margin-bottom:6px">' + a.id + ' · ' + a.severity + ' · ' + a.kind + ' · ' + annEffectiveStatus(a) + '</div>' +
        '<div style="color:var(--p-ink2); margin-bottom:6px">target: ' + annTargetBrief(a.target) + '</div>' +
        '<div style="white-space:pre-wrap; margin-bottom:8px">' + escapeHtml(a.note || '') + '</div>' +
        (a.proposed_fix ? '<div style="font-size:10px; color:var(--p-ink2); margin-bottom:4px">PROPOSED FIX</div><div style="white-space:pre-wrap; margin-bottom:8px">' + escapeHtml(a.proposed_fix) + '</div>' : '') +
        ((a.comments||[]).length ? '<div style="font-size:10px; color:var(--p-ink2); margin:8px 0 4px">COMMENTS</div>' + a.comments.map(c => '<div style="border-left:2px solid var(--p-ink2); padding-left:8px; margin:4px 0; font-size:10px"><div style="color:var(--p-ink2)">' + c.by + ' · ' + c.at + (c.linked_commit ? ' · ' + c.linked_commit.slice(0,7) : '') + '</div><div style="white-space:pre-wrap">' + escapeHtml(c.text) + '</div></div>').join('') : '') +
        (a.resolution ? '<div style="font-size:10px; color:var(--p-ink2); margin:8px 0 4px">RESOLUTION</div><div style="font-size:10px">' + a.resolution.kind + ' by ' + a.resolution.by + (a.resolution.linked_commit ? ' · ' + a.resolution.linked_commit.slice(0,7) : '') + '</div><div style="white-space:pre-wrap; margin-top:4px">' + escapeHtml(a.resolution.summary || '') + '</div>' : '') +
        '</div>'
      );
      _wireDetailClose();
    });
  }
}

function annRenderBadges() {
  if (!_annState.loaded) return;
  const svg = document.querySelector('[data-shape-view]');
  if (!svg) return;
  for (const old of svg.querySelectorAll('.ann-badge')) old.remove();
  const anns = _annState.sidecar?.annotations || [];
  const byAtom = new Map();
  for (const a of anns) {
    const name = a.target?.atom || a.target?.from_atom || a.target?.atom_cls;
    if (!name) continue;
    if (!byAtom.has(name)) byAtom.set(name, []);
    byAtom.get(name).push(a);
  }
  for (const [name, group] of byAtom) {
    const block = svg.querySelector('[data-node-name="' + CSS.escape(name) + '"]');
    if (!block) continue;
    const bbox = block.getBBox();
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'ann-badge');
    const cx = bbox.x + bbox.width - 10;
    const cy = bbox.y + 10;
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('r', 5);
    const worst = group.map(annEffectiveStatus).sort(statusRank)[0];
    dot.setAttribute('fill', STATUS_COLOR[worst]);
    dot.setAttribute('stroke', 'var(--p-paper)');
    dot.setAttribute('stroke-width', '1');
    g.appendChild(dot);
    if (group.length > 1) {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', cx); t.setAttribute('y', cy + 3);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-size', '7');
      t.setAttribute('font-family', 'IBM Plex Mono,monospace');
      t.setAttribute('fill', '#fff');
      t.textContent = group.length;
      g.appendChild(t);
    }
    svg.appendChild(g);
  }
}

function statusRank(s) {
  const order = ['open', 'in_progress', 'addressed', 'stale', 'wontfix', 'verified'];
  return order.indexOf(s);
}

function annOpenPopup({kind, target, title}) {
  if (!_annState.trace) { alert('no trace loaded; annotations need a trace via ?trace=X'); return; }
  if (!_annState.loaded) { alert('server not reachable; run `cxc trace serve --trace-dir <dir>`'); return; }
  $('annotate-popup-title').textContent = title || 'annotate';
  $('annotate-kind').value = kind || 'node';
  $('annotate-target').textContent = annTargetBrief(target);
  $('annotate-target').dataset.target = JSON.stringify(target);
  $('annotate-severity').value = 'finding';
  $('annotate-note').value = '';
  $('annotate-fix').value = '';
  $('annotate-popup').style.display = 'block';
  $('annotate-backdrop').style.display = 'block';
  setTimeout(() => $('annotate-note').focus(), 10);
}

function annClosePopup() {
  $('annotate-popup').style.display = 'none';
  $('annotate-backdrop').style.display = 'none';
}

async function annSubmitPopup() {
  const note = $('annotate-note').value.trim();
  if (!note) { alert('note is required'); return; }
  const target = JSON.parse($('annotate-target').dataset.target || '{}');
  const kind = $('annotate-kind').value;
  const severity = $('annotate-severity').value;
  const fix = $('annotate-fix').value.trim();
  if (!_annState.sidecar) {
    _annState.sidecar = {cxc_annotation_version: 1, source: _annState.trace, commit: '', trace_sha256: '', annotations: []};
  }
  const existing = _annState.sidecar.annotations || [];
  const maxN = existing.reduce((m,a) => {
    const match = /^ann_(\d+)$/.exec(a.id || '');
    return match ? Math.max(m, parseInt(match[1])) : m;
  }, 0);
  const id = 'ann_' + String(maxN + 1).padStart(2, '0');
  const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  const ann = {
    id, kind, target, note, severity,
    author: 'human',
    created_at: now,
    status: 'open',
    comments: [],
  };
  if (fix) ann.proposed_fix = fix;
  _annState.sidecar.annotations = [...existing, ann];
  const ok = await annSave();
  if (ok) {
    annRenderPanel();
    annRenderBadges();
    annClosePopup();
  }
}

function annExport() {
  const anns = _annState.sidecar?.annotations || [];
  if (!anns.length) { alert('no annotations to export'); return; }
  const open = anns.filter(a => annEffectiveStatus(a) === 'open');
  const lines = ['### Trace annotations from the human reviewer', ''];
  if (_annState.sidecar?.commit) lines.push('Commit under review: ' + _annState.sidecar.commit);
  lines.push('Trace artifact: ' + _annState.trace);
  lines.push('');
  for (const a of open) {
    lines.push('**' + a.id + ' (' + a.severity + ', ' + a.kind + ')** — target: ' + annTargetBrief(a.target));
    lines.push('Note: ' + (a.note || ''));
    if (a.proposed_fix) lines.push('Proposed fix: ' + a.proposed_fix);
    lines.push('');
  }
  const text = lines.join('\n');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => alert('copied ' + open.length + ' open annotation(s) to clipboard'));
  else alert(text);
}

async function annPostFocus(data) {
  try {
    await fetch('/focus', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(Object.assign({trace: _annState.trace}, data)),
    });
  } catch (e) { /* server not up */ }
}

// Wire buttons.
(function wireAnnotateButtons() {
  const n = $('annotate-new');
  if (n) n.addEventListener('click', () => {
    const atomName = _expandedAtom || null;
    const seq = (typeof _ptState !== 'undefined' && _ptState && filtered[_ptState.idx]) ? filtered[_ptState.idx].seq : null;
    let kind = 'node', target;
    if (atomName) { kind = 'node'; target = {atom: atomName}; }
    else if (seq != null) { kind = 'event'; target = {trace_seq: seq}; }
    else target = {};
    annOpenPopup({kind, target, title: 'new annotation'});
  });
  const c = $('annotate-cancel'); if (c) c.addEventListener('click', annClosePopup);
  const s = $('annotate-save'); if (s) s.addEventListener('click', annSubmitPopup);
  const b = $('annotate-backdrop'); if (b) b.addEventListener('click', annClosePopup);
  const e = $('annotate-export'); if (e) e.addEventListener('click', annExport);
})();

// Hook render pipeline — overlay badges after each shape re-render.
const _origRenderShape = typeof renderShape === 'function' ? renderShape : null;
if (_origRenderShape) {
  renderShape = async function wrappedRenderShape(...args) {
    const r = await _origRenderShape.apply(this, args);
    annRenderBadges();
    return r;
  };
}

// Load annotations once the trace is in place.
if (_annState.trace) {
  setTimeout(annLoad, 400);
}
</script>
</body>
</html>
