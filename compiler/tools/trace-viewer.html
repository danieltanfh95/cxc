<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cxc trace viewer</title>
  <style>
    :root {
      --p-bg:     #FBF4E7;  --p-ink:    #22160A;
      --p-dim:    #6E604A;  --p-accent: #B65A2A;
      /* aliases for shape-canvas rules copied from the legacy viewer */
      --p-paper:  #FBF4E7;  --p-paper2: #F2E8D2;  --p-paper3: #E7D9BA;
      --p-ink2:   #6E604A;  --p-ink3:   #988872;  --p-hair: #D6C6A8;
      --p-sepia:  #EAD6AF;  --p-wash:   #FAE8CB;
      --p-amber:  #D08A3A;  --p-indigo: #4F5B8C;  --p-rust: #8A4225;
    }
    body.theme-dark {
      --p-bg:     #1E1E22;  --p-ink:    #E6E6EA;
      --p-dim:    #A4A4AC;  --p-accent: #E89B88;
      --p-paper:  #1E1E22;  --p-paper2: #2A2A2E;  --p-paper3: #36363B;
      --p-ink2:   #A4A4AC;  --p-ink3:   #74747C;  --p-hair: #48484F;
      --p-sepia:  #C9A47B;  --p-wash:   rgba(232,155,136,.16);
      --p-amber:  #E8CF95;  --p-indigo: #8DB4E0;  --p-rust: #E8A685;
    }
    #theme-toggle {
      position: fixed; top: 8px; right: 8px; z-index: 50;
      background: var(--p-bg); color: var(--p-ink);
      border: 0.75px solid var(--p-ink); border-radius: 0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
      padding: 4px 10px; cursor: pointer;
    }
    #theme-toggle:hover { background: var(--p-paper2); }
    html,body { margin:0; padding:0; background:var(--p-bg); color:var(--p-ink);
      font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; }
    header { padding: 10px 14px; border-bottom: 1px solid var(--p-dim); }
    header h1 { margin: 0; font-size: 15px; font-weight: 500; }
    .trace-name { color: var(--p-dim); margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
    .loading, .empty, .error { padding: 24px; color: var(--p-dim); }
    .error { color: var(--p-accent); font-family: 'IBM Plex Mono', monospace; }
    .main { display: grid; grid-template-columns: 280px 1fr 340px; gap: 14px; padding: 14px; align-items: start; }
    .stats { max-width: 280px; }
    .stat-row { display:flex; justify-content:space-between; padding: 4px 0;
      border-bottom: 1px dotted var(--p-dim); font-family: 'IBM Plex Mono', monospace; }
    .stat-row .k { color: var(--p-dim); }
    .stat-row .v { font-weight: 500; }
    .shape-stage { min-height: 480px; border: 1px dotted var(--p-dim);
      background: #fff; position: relative; }
    .shape-container { overflow: auto; min-height: 480px; }
    .shape-container svg { display: block; max-width: 100%; height: auto; }
    .annotations { font-size: 12px; }
    .annotations .ann-header { display:flex; justify-content:space-between;
      align-items:baseline; padding: 4px 0; border-bottom: 1px solid var(--p-dim); }
    .annotations .title { font-weight: 500; }
    .annotations .ann-count { color: var(--p-dim); font-family: 'IBM Plex Mono', monospace; }
    .annotations .ann-filters { display:flex; flex-wrap:wrap; gap: 4px; padding: 6px 0; }
    .annotations .ann-filter { font-size: 11px; padding: 2px 6px; border: 1px dotted var(--p-dim);
      background: transparent; cursor: pointer; font-family: inherit; color: var(--p-ink); }
    .annotations .ann-filter[data-active="true"] { background: var(--p-accent); color: var(--p-bg);
      border-color: var(--p-accent); }
    .annotations .ann-list { list-style:none; padding: 0; margin: 0; }
    .annotations .ann-row { padding: 6px 0; border-bottom: 1px dotted var(--p-dim); }
    .annotations .ann-row .ann-head { display:flex; gap:8px; font-family: 'IBM Plex Mono', monospace;
      font-size: 11px; }
    .annotations .ann-row .ann-id { color: var(--p-accent); }
    .annotations .ann-row .ann-status { color: var(--p-dim); }
    .annotations .ann-row .ann-sev { color: var(--p-dim); }
    .annotations .ann-row .ann-target { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
      color: var(--p-dim); margin: 2px 0; }
    .annotations .ann-empty { color: var(--p-dim); font-style: italic; padding: 8px 0; }
    .annotations .ann-note { font-size: 11.5px; margin: 3px 0 6px; color: var(--p-ink); }
    .annotations .ann-actions { display:flex; gap: 6px; }
    .annotations .ann-actions.terminal { color: var(--p-dim); font-family: 'IBM Plex Mono', monospace;
      font-size: 11px; }
    .annotations .btn { font-size: 11px; padding: 3px 8px; border: 1px solid var(--p-dim);
      background: transparent; cursor: pointer; font-family: inherit; color: var(--p-ink); }
    .annotations .btn:hover { background: var(--p-dim); color: var(--p-bg); }
    .annotations .btn.verify { border-color: var(--p-accent); color: var(--p-accent); }
    .annotations .btn.verify:hover { background: var(--p-accent); color: var(--p-bg); }

    .pt-transport { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; align-items: center; background: var(--p-bg);
      border: 1px solid var(--p-ink); padding: 6px 10px; font-size: 10px;
      font-family: 'IBM Plex Mono', monospace; letter-spacing: .1em; z-index: 5; }
    .pt-transport button { background: transparent; color: var(--p-ink);
      border: 1px solid var(--p-ink); font-family: inherit; font-size: 11px;
      padding: 2px 7px; cursor: pointer; }
    .pt-transport button:hover { background: var(--p-ink); color: var(--p-bg); }
    .pt-transport input[type=range] { width: 220px; accent-color: var(--p-accent); }
    .pt-transport select { background: var(--p-bg); color: var(--p-ink);
      border: 1px solid var(--p-ink); font-family: inherit; font-size: 10px; padding: 1px 4px; }
    .pt-status { min-width: 240px; text-align: right; color: var(--p-dim);
      font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; }
    .pt-status b { color: var(--p-ink); font-weight: 600; }
    .pt-count { margin-left: 6px; }

    .shape-block.pt-flash-src { stroke: var(--p-accent) !important; stroke-width: 2.6 !important;
      filter: drop-shadow(0 0 8px var(--p-accent)); }
    .shape-block.pt-flash-dst { stroke: var(--p-accent) !important; stroke-width: 2.6 !important;
      filter: drop-shadow(0 0 10px var(--p-accent)); }
    .shape-edge.pt-flash { stroke: var(--p-accent) !important; stroke-width: 2.4 !important;
      filter: drop-shadow(0 0 6px var(--p-accent)); opacity: 1 !important; }
    .pt-dot { fill: var(--p-accent); pointer-events: none;
      filter: drop-shadow(0 0 4px var(--p-accent)); }

    .heat-toggle { display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 0 0; font-family: 'IBM Plex Mono', monospace;
      font-size: 11px; color: var(--p-dim); }
    .heat-toggle input:disabled + * { opacity: .5; }
    .heat-ramp { font-size: 10px; color: var(--p-dim); }
    body.heatmap-on .shape-block.heat-fill { fill: var(--heat-color) !important; }
    body.heatmap-on .shape-edge.heat-fill  { stroke: var(--heat-color) !important;
      stroke-width: 1.8 !important; opacity: 1 !important; }

    /* Shape graph — ported from the legacy viewer so the SVG painted by
       shape-canvas.js has block fills, edge strokes, labels, phase chips
       etc. Should move into a shared tools/shape-canvas.css once both
       viewers can read from one source. */
    .shape-block { cursor: pointer;
      fill: var(--p-paper) !important; stroke: var(--p-ink) !important;
      stroke-width: 0.9 !important; }
    .shape-block.main   { fill: var(--p-sepia) !important; stroke-width: 1.6 !important; }
    .shape-block.root   { fill: var(--p-paper2) !important; stroke: var(--p-ink2) !important;
      stroke-dasharray: 3 2 !important; }
    .shape-block.owner, .shape-block.owner.main { stroke-width: 1.6 !important; }
    .shape-block.container, .shape-block.container.main,
    .shape-container-tab, .shape-container-tab.main {
      fill: transparent !important; stroke: var(--p-ink) !important;
      stroke-width: 0.6 !important; stroke-dasharray: 4 3 !important; }
    .shape-container-tab { cursor: pointer; }
    .shape-block-halo-outer { fill: none; pointer-events: none;
      stroke: var(--p-wash) !important; stroke-width: 8 !important; }
    .shape-block-label { pointer-events: none; text-anchor: middle;
      fill: var(--p-ink2) !important; font-family: 'Barlow Condensed', Impact, 'Arial Narrow', sans-serif;
      font-weight: 500; font-size: 15px; letter-spacing: .04em; }
    .shape-block-label.container { text-anchor: start; font-size: 13px; letter-spacing: .06em; }
    .shape-block-sub { pointer-events: none; text-anchor: middle; font-variant-numeric: tabular-nums;
      fill: var(--p-ink2) !important; font-family: 'IBM Plex Mono', monospace;
      font-size: 11px; letter-spacing: .12em; }
    .shape-block-sub.container { text-anchor: end; }
    .shape-block-badge { fill: var(--p-paper3) !important; stroke: var(--p-hair) !important;
      stroke-width: 0.5 !important; }
    .shape-block-badge-label { pointer-events: none; text-anchor: middle;
      font-variant-numeric: tabular-nums; fill: var(--p-ink) !important;
      font-family: 'IBM Plex Mono', monospace; font-weight: 600; letter-spacing: .1em; }

    .shape-edge { stroke: var(--p-ink) !important; stroke-width: 1.1 !important;
      fill: none; pointer-events: stroke !important; }
    .shape-edge.sync { stroke: var(--p-indigo) !important; stroke-width: 1.6 !important; }
    .shape-edge.self { stroke: var(--p-rust) !important; stroke-dasharray: 4 3 !important; }
    .shape-edge:hover, .shape-edge.shape-edge-hover {
      stroke: var(--p-accent) !important; stroke-width: 2.4 !important; }
    .shape-edge-label { pointer-events: none; paint-order: stroke fill; stroke-linejoin: round;
      fill: var(--p-ink) !important; font-family: 'IBM Plex Mono', monospace;
      font-weight: 500; font-size: 11px; stroke: var(--p-paper) !important; stroke-width: 3px; }
    rect.shape-edge-label-bg { pointer-events: all; cursor: default; }
    .shape-edge-label-bg { pointer-events: none; opacity: 0.95;
      fill: var(--p-paper) !important; stroke: none !important; }

    .phase-node { fill: var(--p-paper) !important; stroke: var(--p-ink) !important;
      stroke-width: 0.9 !important; }
    .phase-node.initial { fill: var(--p-amber) !important; }
    .phase-node.end { fill: var(--p-paper3) !important; }
    .phase-node.unreached { stroke-dasharray: 4 3 !important; opacity: .6; }
    .phase-label { text-anchor: middle; pointer-events: none;
      fill: var(--p-ink) !important; font-family: 'Barlow Condensed', Impact, sans-serif;
      font-weight: 500; letter-spacing: .06em; }
    .phase-arc { fill: none; stroke: var(--p-ink) !important; stroke-width: 0.9 !important; }
    .phase-arc-label { pointer-events: none; paint-order: stroke fill; stroke-linejoin: round;
      fill: var(--p-ink) !important; font-family: 'IBM Plex Mono', monospace;
      stroke: var(--p-paper) !important; }
    .phase-arc-label-bg { fill: var(--p-paper) !important; opacity: .95; pointer-events: none; }
    .phase-self-badge { fill: var(--p-paper3) !important; stroke: var(--p-hair) !important;
      stroke-width: 0.5 !important; cursor: pointer; }
    .phase-self-badge-label { fill: var(--p-accent) !important;
      font-family: 'IBM Plex Mono', monospace; font-weight: 600; letter-spacing: .08em;
      text-anchor: middle; pointer-events: none; }
    .phase-arc-hit, .shape-edge-hit { stroke-linecap: round; stroke-linejoin: round;
      vector-effect: non-scaling-stroke; }
    .phase-arc-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; }
  </style>
</head>
<body>
  <button id="theme-toggle" title="Toggle light / dark theme" aria-label="Theme" aria-pressed="false"><span aria-hidden="true">☀</span></button>
  <div id="app">loading…</div>
  <script>
  (function(){
    var urlTheme = new URLSearchParams(location.search).get('theme');
    var saved = urlTheme || localStorage.getItem('cxc-theme');
    if (saved === 'dark') document.body.classList.add('theme-dark');
    function paint(){
      var tb = document.getElementById('theme-toggle');
      if (!tb) return;
      var dark = document.body.classList.contains('theme-dark');
      tb.setAttribute('aria-pressed', String(dark));
      tb.querySelector('span').textContent = dark ? '☾' : '☀';
    }
    document.addEventListener('DOMContentLoaded', function(){
      var tb = document.getElementById('theme-toggle');
      tb.addEventListener('click', function(){
        var dark = document.body.classList.toggle('theme-dark');
        localStorage.setItem('cxc-theme', dark ? 'dark' : 'light');
        paint();
      });
      paint();
    });
  })();
  </script>
  <script src="vendor/elk.bundled.js"></script>
  <script src="shape-canvas.js"></script>
  <script src="./dist/trace-viewer-v2.js"></script>
</body>
</html>
