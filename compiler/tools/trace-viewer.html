// ===== SHAPE VIEW (layered class diagram — program cascade topology) =====
// Answers "what shape is this program?" — rectangular blocks per atom class,
// arranged top-down in cascade layers (BFS depth from `(root)`), with
// straight edges labeled by the messages that flow between them. Distinct
// from the `graph` view, which is instance-scale and weighted by message
// counts; `shape` is class-scale and topology-first.
function assignLayers(nodes, edges) {
  // BFS shortest-path from a synthetic source (`(root)` if present, else
  // the highest-out-degree node). Cascade depth = fewest hops from the
  // initial trigger, which is what a program-shape diagram wants;
  // longest-path over a cyclic multigraph inflates depth without meaning
  // because reciprocal edges (e.g. Player→CxcMain deploy_done) keep
  // pushing nodes down through the cycle.
  const adj = new Map();
  nodes.forEach(n => adj.set(n.id, []));
  for (const e of edges) if (e.src !== e.dst) adj.get(e.src).push(e.dst);
  const layer = new Map();
  const rootId = nodes.some(n => n.id === '(root)')
    ? '(root)'
    : (() => {
        const outDeg = new Map();
        nodes.forEach(n => outDeg.set(n.id, 0));
        edges.forEach(e => { if (e.src !== e.dst) outDeg.set(e.src, (outDeg.get(e.src) || 0) + 1); });
        return [...outDeg.entries()].sort((a, b) => b[1] - a[1])[0][0];
      })();
  const queue = [rootId];
  layer.set(rootId, 0);
  while (queue.length) {
    const id = queue.shift();
    for (const nxt of (adj.get(id) || [])) {
      if (layer.has(nxt)) continue;
      layer.set(nxt, layer.get(id) + 1);
      queue.push(nxt);
    }
  }
  // Unreached nodes (isolated container atoms with only inbound edges from
  // still-unreached senders, or fully-disconnected): pin to the deepest
  // occupied layer so they render as bottom-row leaves rather than layer 0.
  const maxL = Math.max(0, ...[...layer.values()]);
  nodes.forEach(n => { if (!layer.has(n.id)) layer.set(n.id, maxL + 1); });
  return layer;
}

// ELK adapter: builds a compound (hierarchical) graph and runs ELK's
// layered algorithm. Returns the same shape the render loop expects
// (pos map + edge list) so downstream code doesn't care which layout
// engine ran. Compound layout means owner atoms literally CONTAIN their
// owned children — no decorative overlay needed.
async function elkShapeLayout(nodes, edges, ownerOf, opts) {
  if (!_elk) throw new Error('elkjs not loaded');
  const nodeMap = new Map(nodes.map(n => [n.id, n]));
  const childrenOf = new Map();
  for (const [c, p] of ownerOf) {
    if (!childrenOf.has(p)) childrenOf.set(p, []);
    childrenOf.get(p).push(c);
  }
  const isRoot = (id) => id === '(root)';
  const buildElkNode = (n) => {
    const kids = childrenOf.get(n.id) || [];
    const en = {
      id: n.id,
      width: isRoot(n.id) ? 90 : opts.blockW,
      height: isRoot(n.id) ? 30 : opts.blockHFor(n),
    };
    if (kids.length) {
      // Tab clearance math: our OWN tab is ABOVE our container, so it
      // consumes the enclosing scope's padding. Internal top space is
      // just for any nested child's tab (38px above child border + gap).
      const hasNestedContainer = kids.some(k => (childrenOf.get(k) || []).length > 0);
      const topPad = hasNestedContainer ? 72 : 24;
      en.children = kids.map(k => buildElkNode(nodeMap.get(k)));
      en.layoutOptions = {
        'elk.padding': `[top=${topPad},left=32,bottom=24,right=32]`,
        'elk.spacing.nodeNode': String(opts.nodesep * 1.5),
        // Extra between-layer spacing so a child container's tab clears
        // its predecessor's bottom border with room to breathe.
        'elk.layered.spacing.nodeNodeBetweenLayers': String(opts.ranksep),
      };
    }
    return en;
  };
  const topLevel = nodes.filter(n => !ownerOf.has(n.id));
  const elkGraph = {
    id: 'root',
    layoutOptions: {
      'elk.algorithm': 'layered',
      'elk.direction': opts.orient === 'lr' ? 'RIGHT' : 'DOWN',
      'elk.hierarchyHandling': 'INCLUDE_CHILDREN',
      // Room for title tabs (38px) attached above top-level containers.
      'elk.padding': '[top=50,left=20,bottom=20,right=20]',
      // Horizontal breathing (siblings on the same rank).
      'elk.spacing.nodeNode': String(opts.nodesep * 2),
      // Vertical breathing between ranks so containers don't crash into
      // the tab of the next rank down.
      'elk.layered.spacing.nodeNodeBetweenLayers': String(opts.ranksep * 1.4),
      'elk.spacing.edgeNode': String(opts.edgesep),
      'elk.spacing.edgeEdge': '24',
      'elk.layered.crossingMinimization.strategy': 'LAYER_SWEEP',
      'elk.edgeRouting': 'ORTHOGONAL',
    },
    children: topLevel.map(buildElkNode),
    edges: edges.filter(e => e.src !== e.dst).map(e => ({
      id: e.src + '__' + e.dst,
      sources: [e.src],
      targets: [e.dst],
    })),
  };
  const result = await _elk.layout(elkGraph);
  const pos = new Map();
  const parentOf = new Map();  // childId → parentId (for label placement)
  const walkNodes = (node, ox, oy, parentId) => {
    const ax = ox + (node.x || 0);
    const ay = oy + (node.y || 0);
    if (node.id !== 'root') {
      pos.set(node.id, {
        x: ax, y: ay, w: node.width, h: node.height,
        cx: ax + node.width / 2, cy: ay + node.height / 2,
      });
      if (parentId) parentOf.set(node.id, parentId);
    }
    for (const c of (node.children || [])) {
      walkNodes(c, ax, ay, node.id === 'root' ? null : node.id);
    }
  };
  walkNodes(result, 0, 0, null);
  const layoutEdges = [];
  const walkEdges = (node, ax, ay) => {
    for (const e of (node.edges || [])) {
      const pts = (e.sections || []).flatMap(s => {
        const raw = [s.startPoint, ...(s.bendPoints || []), s.endPoint];
        return raw.map(p => ({ x: p.x + ax, y: p.y + ay }));
      });
      layoutEdges.push({ src: e.sources[0], dst: e.targets[0], points: pts });
    }
    for (const c of (node.children || [])) {
      walkEdges(c, ax + (c.x || 0), ay + (c.y || 0));
    }
  };
  walkEdges(result, 0, 0);
  return { pos, layoutEdges, parentOf, W: result.width || 800, H: result.height || 400 };
}

let _renderShapeToken = 0;
async function renderShape() {
  const stage = $('stage-main');
  stage.innerHTML = '';
  const myToken = ++_renderShapeToken;
  // Legend — floating card so first-time readers can decode colors/dashes
  // without hunting through docs. Closeable; a compact "legend" chip
  // reopens it. Preference persists in localStorage so returning users
  // keep their chosen state across reloads.
  // When a phase panel is open, the legend covers a shrinking topology viewport
  // and its content is no longer load-bearing (the reader has already decoded
  // the colors). Auto-collapse to the small "legend" chip; user can reopen.
  const phasePanelOpen = document.body.classList.contains('phase-panel-open');
  const legendHidden = localStorage.getItem('cxc-shape-legend-hidden') === '1' || phasePanelOpen;
  function mountLegend() {
    const existing = document.getElementById('shape-legend');
    if (existing) existing.remove();
    const reopenExisting = document.getElementById('shape-legend-reopen');
    if (reopenExisting) reopenExisting.remove();
    const phaseOpenNow = document.body.classList.contains('phase-panel-open');
    if (localStorage.getItem('cxc-shape-legend-hidden') === '1' || phaseOpenNow) {
      const btn = document.createElement('button');
      btn.id = 'shape-legend-reopen';
      btn.textContent = 'legend';
      btn.addEventListener('click', () => {
        localStorage.setItem('cxc-shape-legend-hidden', '0');
        mountLegend();
      });
      stage.appendChild(btn);
      return;
    }
    const legend = document.createElement('div');
    legend.id = 'shape-legend';
    legend.innerHTML = `
      <button id="shape-legend-close" title="hide legend">×</button>
      <div class="legend-group">
        <h5>atoms</h5>
        <div class="legend-row"><span class="legend-swatch" style="background:#d99a4a;"></span>main</div>
        <div class="legend-row"><span class="legend-swatch" style="background:#4a90d9;"></span>user atom</div>
        <div class="legend-row" title="synthetic origin for sends that happened before any arm fired: atom constructors + the first kickoff into main"><span class="legend-swatch" style="background:#999;"></span>init / end</div>
      </div>
      <div class="legend-group">
        <h5>edges</h5>
        <div class="legend-row"><span class="legend-line" style="border-top:1.6px solid #333;"></span>async send</div>
        <div class="legend-row"><span class="legend-line" style="border-top:2px solid #5340b0;"></span>sync only</div>
        <div class="legend-row"><span class="legend-line" style="border-top:1.6px solid #c47a20;"></span>self-loop</div>
        <div class="legend-row" title="label 'foo +N' = top message plus N others on same edge — hover for full list"><span style="display:inline-block; width:22px; text-align:center; color:#666; font-family:'SF Mono',Menlo,monospace; font-size:10px;">+N</span>= more msgs</div>
      </div>
      <div class="legend-group">
        <h5>phases</h5>
        <div class="legend-row"><span class="legend-swatch" style="background:#ffd580;"></span>initial</div>
        <div class="legend-row"><span class="legend-swatch" style="background:#b3d4f0;"></span>intermediate</div>
        <div class="legend-row"><span class="legend-swatch" style="background:#ccc;"></span>end</div>
        <div class="legend-row"><span class="legend-swatch" style="background:#d99a4a;"></span>badge <b style="color:#fff; font-size:9px; padding:0 3px; background:#d99a4a; border-radius:2px; margin-left:2px;">self N</b> = N self-transitions</div>
      </div>
      <div class="legend-group">
        <h5>layout</h5>
        <div class="legend-row" style="color:#666; font-size:10px;">alternating bands = cascade layers (BFS depth from root)</div>
      </div>`;
    stage.appendChild(legend);
    document.getElementById('shape-legend-close').addEventListener('click', () => {
      localStorage.setItem('cxc-shape-legend-hidden', '1');
      mountLegend();
    });
  }
  mountLegend();

  // Zoom controls — pill in top-right (bottom-left is taken by legend).
  // Updates the shape SVG's viewBox: smaller viewBox = zoomed in. Pan
  // shares state via localStorage keys cxc-shape-{zoom,panx,pany}. Ctrl+
  // scroll zooms around the cursor position.
  if (!document.getElementById('shape-zoom')) {
    const zctl = document.createElement('div');
    zctl.id = 'shape-zoom';
    zctl.innerHTML = `
      <button id="shape-zoom-out" title="zoom out (ctrl+scroll)">−</button>
      <span id="shape-zoom-level">100%</span>
      <button id="shape-zoom-in" title="zoom in (ctrl+scroll)">+</button>
      <button id="shape-zoom-reset" title="reset to 100% and centre">⟲</button>
    `;
    stage.appendChild(zctl);
    const svgSel = () => stage.querySelector('svg');
    const updateVB = (z, px, py) => {
      const svgEl = svgSel();
      if (!svgEl || !svgEl.dataset.nativeW) return;
      const nW = +svgEl.dataset.nativeW, nH = +svgEl.dataset.nativeH;
      svgEl.setAttribute('viewBox', `${px} ${py} ${nW / z} ${nH / z}`);
      localStorage.setItem('cxc-shape-zoom', String(z));
      localStorage.setItem('cxc-shape-panx', String(px));
      localStorage.setItem('cxc-shape-pany', String(py));
      const lvl = document.getElementById('shape-zoom-level');
      if (lvl) lvl.textContent = Math.round(z * 100) + '%';
    };
    const readState = () => ({
      z: Math.max(0.15, Math.min(4, parseFloat(localStorage.getItem('cxc-shape-zoom')) || 1)),
      px: parseFloat(localStorage.getItem('cxc-shape-panx')) || 0,
      py: parseFloat(localStorage.getItem('cxc-shape-pany')) || 0,
    });
    const zoomAround = (newZoom, cx, cy) => {
      const svgEl = svgSel();
      if (!svgEl || !svgEl.dataset.nativeW) return;
      const s = readState();
      const clamped = Math.max(0.15, Math.min(4, newZoom));
      const nW = +svgEl.dataset.nativeW;
      const rect = svgEl.getBoundingClientRect();
      const fx = (cx - rect.left) / rect.width;
      const fy = (cy - rect.top) / rect.height;
      const vbWNew = nW / clamped;
      const vbHNew = (+svgEl.dataset.nativeH) / clamped;
      const vbWOld = nW / s.z;
      const vbHOld = (+svgEl.dataset.nativeH) / s.z;
      const px = s.px + fx * (vbWOld - vbWNew);
      const py = s.py + fy * (vbHOld - vbHNew);
      updateVB(clamped, px, py);
    };
    const stepCentered = (delta) => {
      const svgEl = svgSel();
      if (!svgEl) return;
      const rect = svgEl.getBoundingClientRect();
      const s = readState();
      zoomAround(s.z + delta, rect.left + rect.width / 2, rect.top + rect.height / 2);
    };
    document.getElementById('shape-zoom-out').addEventListener('click', () => stepCentered(-0.1));
    document.getElementById('shape-zoom-in').addEventListener('click', () => stepCentered(0.1));
    document.getElementById('shape-zoom-reset').addEventListener('click', () => updateVB(1, 0, 0));
    stage.addEventListener('wheel', (ev) => {
      if (!ev.ctrlKey && !ev.metaKey) return;
      ev.preventDefault();
      const s = readState();
      zoomAround(s.z + (ev.deltaY < 0 ? 0.1 : -0.1), ev.clientX, ev.clientY);
    }, { passive: false });
    // Initial sync so the level indicator matches persisted state.
    const s0 = readState();
    updateVB(s0.z, s0.px, s0.py);
  }

  // Onboarding hint — first-time only. localStorage tracks dismissal.
  if (localStorage.getItem('cxc-shape-hint-dismissed') !== '1') {
    const hint = document.createElement('div');
    hint.id = 'shape-hint';
    hint.innerHTML = `Click any atom for its <b>phase graph</b>. Hover an edge for its message list. <span class="dismiss" title="dismiss hint">×</span>`;
    stage.appendChild(hint);
    hint.querySelector('.dismiss').addEventListener('click', () => {
      localStorage.setItem('cxc-shape-hint-dismissed', '1');
      hint.remove();
    });
  }
  let {nodes, edges} = buildGraph('class');
  const showInit = document.getElementById('shape-show-init')?.checked;
  if (!showInit) {
    nodes = nodes.filter(n => n.id !== '(root)');
    edges = edges.filter(e => e.src !== '(root)' && e.dst !== '(root)');
  }
  if (!nodes.length) { stage.innerHTML = '<div id="empty-state">No events after filters.</div>'; return; }
  const orient = $('shape-orient').value;   // 'lr' | 'tb'
  const expand = $('shape-expand').checked; // compact by default

  // When the compiler shape sidecar is loaded, restrict blocks to atoms
  // the source declares (user atoms + main), and enrich each node with
  // its shape entry so we can draw pills and expand a phase graph. Any
  // trace-observed target class without a shape entry (auto containers,
  // synthesized fan-in atoms) is dropped from the topology; its edges
  // are dropped too so we don't leave dangling arrows to nowhere.
  if (_shape) {
    const kept = new Map();
    for (const n of nodes) {
      if (n.id === '(root)') { kept.set(n.id, n); continue; }
      const s = atomShapeForClass(n.cls);
      if (s) { n.shape = s; n.label = s.name; kept.set(n.id, n); }
    }
    nodes = [...kept.values()];
    const keepId = (id) => kept.has(id);
    edges = edges.filter(e => keepId(e.src) && keepId(e.dst));
  }
  // Block sizes
  const blockW = expand ? 210 : 180;
  const blockHFor = (n) => n.shape ? 78 : 58;

  // Compute ownership: for each atom-typed field NOT in the ctor param
  // list, the owner-atom class owns the field-type class. Used below to
  // build a compound graph so owners literally contain their children.
  const nodeIds = new Set(nodes.map(n => n.id));
  const clsToId = new Map();
  for (const n of nodes) {
    if (n.shape) clsToId.set(n.shape.name, n.id);
    clsToId.set(n.id, n.id);
  }
  const stripContainer = (t) => {
    let s = String(t || '');
    s = s.replace(/^Map of \([^,]+,\s*/, '').replace(/\)$/, '');
    s = s.replace(/^(List|Set) of /, '');
    s = s.replace(/[!?]$/, '');
    return s.trim();
  };
  // ownerOf[childId] = parentId. First owner wins for shared classes
  // (e.g. main.p0:Player and main.p1:Player both parent Player once).
  const ownerOf = new Map();
  for (const n of nodes) {
    if (!n.shape) continue;
    const ctorNames = new Set((n.shape.ctor_params || []).map(p => p.name));
    for (const f of (n.shape.fields || [])) {
      if (ctorNames.has(f.name)) continue;
      const childCls = stripContainer(f.type);
      const childId = clsToId.get(childCls);
      if (!childId || !nodeIds.has(childId) || childId === n.id) continue;
      if (ownerOf.has(childId)) continue;
      ownerOf.set(childId, n.id);
    }
  }
  // Metadata for the edge render loop (msgs list, sync count, total).
  const edgeMeta = new Map();
  for (const e of edges) {
    if (e.src === e.dst) continue;
    edgeMeta.set(e.src + '|' + e.dst, e);
  }
  // Compound layered layout via ELK — parents literally contain their
  // owned children (Lane wraps LaneSide wraps PlayableUnit), so
  // ownership reads without decorative dashed overlays. Async because
  // ELK computes in a Web Worker; the render token guards against a
  // superseded render mutating stage after a newer render started.
  let elkResult;
  try {
    elkResult = await elkShapeLayout(nodes, edges, ownerOf, {
      orient, blockW, blockHFor,
      nodesep: expand ? 70 : 56,
      ranksep: expand ? 160 : 130,
      edgesep: 40,
    });
  } catch (err) {
    stage.innerHTML = `<div id="empty-state">Layout failed: ${escapeHtml(String(err.message || err))}</div>`;
    return;
  }
  if (myToken !== _renderShapeToken) return;
  const { pos, layoutEdges, parentOf } = elkResult;
  const rightLabelPad = 80;
  const W = Math.max(stage.clientWidth, elkResult.W + rightLabelPad);
  const H = Math.max(stage.clientHeight, elkResult.H + 40);

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  // Pan+zoom via SVG viewBox — the SVG fills the stage viewport (100%);
  // zoom scales the viewBox size, pan shifts its origin. Works at any
  // zoom level (including <100%) because we're not relying on the
  // browser's scrollbars.
  const shapeZoom = Math.max(0.15, Math.min(4, parseFloat(localStorage.getItem('cxc-shape-zoom')) || 1));
  const panX0 = parseFloat(localStorage.getItem('cxc-shape-panx')) || 0;
  const panY0 = parseFloat(localStorage.getItem('cxc-shape-pany')) || 0;
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', '100%');
  svg.setAttribute('viewBox', `${panX0} ${panY0} ${W / shapeZoom} ${H / shapeZoom}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.dataset.nativeW = W;
  svg.dataset.nativeH = H;

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = `
    <marker id="shape-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L11,6 L0,11 z" fill="#333"></path>
    </marker>
    <marker id="shape-arrow-self" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L10,5.5 L0,10 z" fill="#c47a20"></path>
    </marker>
  `;
  svg.appendChild(defs);

  // Layer bands — group leaf nodes by rank position (skip owners since
  // ELK-compound sizes them to enclose their children, so their center
  // isn't a meaningful rank position).
  const parentIds = new Set(ownerOf.values());
  const rankAxis = orient === 'lr' ? 'cx' : 'cy';
  const rankSizes = new Map();
  for (const [id, p] of pos) {
    if (parentIds.has(id)) continue;
    const r = Math.round(p[rankAxis] / 40) * 40;
    if (!rankSizes.has(r)) rankSizes.set(r, { min: r, max: r });
  }
  const rankPositions = [...rankSizes.keys()].sort((a, b) => a - b);
  rankPositions.forEach((r, idx) => {
    if (idx % 2 !== 0) return;
    const prev = idx > 0 ? (rankPositions[idx - 1] + r) / 2 : r - 60;
    const next = idx < rankPositions.length - 1 ? (rankPositions[idx + 1] + r) / 2 : r + 60;
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    if (orient === 'lr') {
      rect.setAttribute('x', prev);
      rect.setAttribute('y', 0);
      rect.setAttribute('width', next - prev);
      rect.setAttribute('height', H);
    } else {
      rect.setAttribute('x', 0);
      rect.setAttribute('y', prev);
      rect.setAttribute('width', W);
      rect.setAttribute('height', next - prev);
    }
    rect.setAttribute('class', 'shape-layer-band');
    svg.appendChild(rect);
  });

  // Ownership now reads directly from ELK's compound containment — the
  // parent pill physically encloses its children. Still need childrenOf
  // and mainNodeId downstream for the pill styling (isContainer / isOwner)
  // and the layer-band skip logic.
  const childrenOf = new Map();
  for (const [child, parent] of ownerOf) {
    if (!childrenOf.has(parent)) childrenOf.set(parent, []);
    childrenOf.get(parent).push(child);
  }
  const mainNodeId = (nodes.find(n => n.shape && n.shape.name === _shape?.main_atom) || {}).id;

  // Edges: draw Dagre's routed polylines. Each Dagre edge exposes a
  // `points` array of {x, y} bend points from source-boundary to
  // destination-boundary. We convert those into an SVG path with softly
  // rounded corners. Self-loops are excluded from Dagre and rendered
  // manually below (Dagre's default self-loop routing is messy for our
  // block-with-attached-label idiom).
  const edgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  function pointsToPath(pts) {
    if (!pts || pts.length === 0) return '';
    if (pts.length === 1) return `M${pts[0].x},${pts[0].y}`;
    let d = `M${pts[0].x},${pts[0].y}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const prev = pts[i - 1], cur = pts[i], next = pts[i + 1];
      const midPrevX = (prev.x + cur.x) / 2, midPrevY = (prev.y + cur.y) / 2;
      const midNextX = (cur.x + next.x) / 2, midNextY = (cur.y + next.y) / 2;
      d += ` L${midPrevX},${midPrevY} Q${cur.x},${cur.y} ${midNextX},${midNextY}`;
    }
    const last = pts[pts.length - 1];
    d += ` L${last.x},${last.y}`;
    return d;
  }
  // Precompute node bboxes so labels can be shoved off any block they'd
  // otherwise land on. Blocks render after edges, so a label inside a
  // block gets clipped; we treat blocks as obstacles for label placement.
  const blockRects = [...pos.values()].map(b => ({ x: b.x - 4, y: b.y - 4, w: b.w + 8, h: b.h + 8 }));
  // Track already-placed edge label rects so a new candidate that overlaps
  // an existing label gets rejected. This kills the "two labels on one
  // row" bug muse flagged (`dea combat_done +2`).
  const placedLabels = [];
  function rectsOverlap(a, b) {
    return !(a.x + a.w < b.x || b.x + b.w < a.x || a.y + a.h < b.y || b.y + b.h < a.y);
  }
  function pointInAnyBlock(x, y) {
    return blockRects.some(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  }
  function labelRectClears(cx, cy, w, h) {
    const rect = { x: cx - w/2, y: cy - h/2, w, h };
    // Reject if inside any block, or overlaps a previously-placed label.
    const corners = [
      [rect.x, rect.y], [rect.x + w, rect.y],
      [rect.x, rect.y + h], [rect.x + w, rect.y + h],
      [cx, cy],
    ];
    if (corners.some(([x, y]) => pointInAnyBlock(x, y))) return false;
    if (placedLabels.some(pl => rectsOverlap(rect, pl))) return false;
    return true;
  }
  function bestLabelAnchor(pts) {
    let best = { x: pts[0].x, y: pts[0].y, len: 0 };
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy);
      if (len > best.len) best = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, len };
    }
    return best;
  }
  for (const layoutEdge of layoutEdges) {
    const e = edgeMeta.get(layoutEdge.src + '|' + layoutEdge.dst);
    if (!e) continue;
    if (!layoutEdge.points || !layoutEdge.points.length) continue;
    const pts = layoutEdge.points;
    const isSync = e.sync === e.total && e.total > 0;
    const path = pointsToPath(pts);
    const edgeId = `edge-${e.src}--${e.dst}`.replace(/[^a-zA-Z0-9-]/g, '_');
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', path);
    p.setAttribute('class', 'shape-edge' + (isSync ? ' sync' : ''));
    p.setAttribute('marker-end', 'url(#shape-arrow)');
    p.dataset.src = e.src;
    p.dataset.dst = e.dst;
    p.dataset.edgeId = edgeId;
    const msgList = [...e.msgs.entries()].sort((a, b) => b[1] - a[1]);
    const msgSummary = msgList.slice(0, 8).map(([m, c]) => `${m} × ${c}`).join('\n')
      + (msgList.length > 8 ? `\n… +${msgList.length - 8} more` : '');
    const extraCount = msgList.length - 1;
    const extraHint = extraCount > 0 ? `\n\n"+${extraCount}" = ${extraCount} additional message name${extraCount > 1 ? 's' : ''} routed through this edge` : '';
    p.innerHTML = `<title>${e.src} → ${e.dst}\n${e.total} messages (${e.sync} sync)\n\n${msgSummary}${extraHint}</title>`;
    p.style.cursor = 'pointer';
    p.addEventListener('click', () => showEdgeDetail(e));
    edgeG.appendChild(p);

    // Label on the longest polyline segment; walk along polyline anchors
    // until we find a position that clears every block. This kills the
    // "dea combat_done +2" mid-word clip Muse flagged (block edges cut
    // labels that Dagre placed in a corner near a block).
    const topMsg = msgList[0] ? msgList[0][0] : '?';
    const lbl = topMsg + (msgList.length > 1 ? ` +${extraCount}` : '');
    const textW = lbl.length * 7.6 + 12;
    const textH = 16;
    const candidates = [];
    // Best-anchor first, then sample along every interior segment at
    // midpoint, 1/4, 3/4 for fallbacks.
    candidates.push(bestLabelAnchor(pts));
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      for (const t of [0.5, 0.25, 0.75, 0.15, 0.85]) {
        candidates.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
      }
    }
    // Try each candidate at its natural Y first; if none clears blocks +
    // other labels, try small perpendicular offsets so the label peels
    // slightly off the polyline. Last-resort: keep the natural anchor.
    let anchor = candidates[0];
    let found = false;
    for (const cand of candidates) {
      if (labelRectClears(cand.x, cand.y, textW, textH)) { anchor = cand; found = true; break; }
    }
    if (!found) {
      outer: for (const cand of candidates) {
        for (const dy of [-12, 12, -24, 24, -36, 36]) {
          if (labelRectClears(cand.x, cand.y + dy, textW, textH)) {
            anchor = { x: cand.x, y: cand.y + dy }; found = true; break outer;
          }
        }
      }
    }
    placedLabels.push({ x: anchor.x - textW/2, y: anchor.y - 9, w: textW, h: textH });
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('x', anchor.x - textW / 2);
    bg.setAttribute('y', anchor.y - 9);
    bg.setAttribute('width', textW);
    bg.setAttribute('height', textH);
    bg.setAttribute('rx', 3);
    bg.setAttribute('class', 'shape-edge-label-bg');
    bg.dataset.edgeId = edgeId;
    edgeG.appendChild(bg);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', anchor.x);
    t.setAttribute('y', anchor.y + 3);
    t.setAttribute('class', 'shape-edge-label');
    t.setAttribute('text-anchor', 'middle');
    t.dataset.edgeId = edgeId;
    if (msgList.length > 1) {
      t.innerHTML = `<title>${e.src} → ${e.dst}\ntop: ${topMsg}\n+${extraCount} additional message name${extraCount > 1 ? 's' : ''} routed through this edge</title>`;
    }
    t.textContent = lbl;
    const highlightPair = (on) => {
      const q = `[data-edge-id="${edgeId}"]`;
      svg.querySelectorAll(q).forEach(el => {
        if (on) el.classList.add('shape-edge-hover');
        else    el.classList.remove('shape-edge-hover');
      });
    };
    p.addEventListener('mouseenter', () => highlightPair(true));
    p.addEventListener('mouseleave', () => highlightPair(false));
    bg.addEventListener('mouseenter', () => highlightPair(true));
    bg.addEventListener('mouseleave', () => highlightPair(false));
    edgeG.appendChild(t);
  }

  // Self-loops: bracket on the trailing-across side of the block (right in
  // TB, bottom in LR). Rendered manually because Dagre's self-loop routing
  // produces crossings.
  for (const e of edges) {
    if (e.src !== e.dst) continue;
    const src = pos.get(e.src);
    if (!src) continue;
    const isTB = orient !== 'lr';
    const trailingC = isTB ? src.x + src.w : src.y + src.h;
    const midA = isTB ? src.cy : src.cx;
    const bump = trailingC + 20;
    const halfA = (isTB ? src.h : src.w) * 0.35;
    const leftA = midA - halfA, rightA = midA + halfA;
    const mk = (a, c) => isTB ? `${c},${a}` : `${a},${c}`;
    const path = `M${mk(leftA, trailingC)} L${mk(leftA, bump)} L${mk(rightA, bump)} L${mk(rightA, trailingC + 2)}`;
    const edgeId = `edge-self-${e.src}`.replace(/[^a-zA-Z0-9-]/g, '_');
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', path);
    p.setAttribute('class', 'shape-edge self');
    p.setAttribute('marker-end', 'url(#shape-arrow-self)');
    p.dataset.edgeId = edgeId;
    const msgList = [...e.msgs.entries()].sort((a, b) => b[1] - a[1]);
    const msgSummary = msgList.slice(0, 8).map(([m, c]) => `${m} × ${c}`).join('\n');
    p.innerHTML = `<title>${e.src} → ${e.src} (self)\n${e.total} messages\n\n${msgSummary}</title>`;
    p.style.cursor = 'pointer';
    p.addEventListener('click', () => showEdgeDetail(e));
    // Hover on the self-loop arrow, its bg, or its label lights up the trio
    // together — matches the behavior of cross-atom edges above and lets the
    // user find self-flows the same way they find inbound flows.
    const highlightSelf = (on) => {
      const q = `[data-edge-id="${edgeId}"]`;
      svg.querySelectorAll(q).forEach(el => {
        if (on) el.classList.add('shape-edge-hover');
        else    el.classList.remove('shape-edge-hover');
      });
    };
    p.addEventListener('mouseenter', () => highlightSelf(true));
    p.addEventListener('mouseleave', () => highlightSelf(false));
    edgeG.appendChild(p);
    const topMsg = msgList[0] ? msgList[0][0] : '?';
    const lbl = topMsg + (msgList.length > 1 ? ` +${msgList.length - 1}` : '');
    const textW = lbl.length * 7.6 + 12;
    const lx = isTB ? bump + 6 : midA;
    const ly = isTB ? midA : bump + 12;
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('x', isTB ? lx : lx - textW / 2);
    bg.setAttribute('y', ly - 9);
    bg.setAttribute('width', textW);
    bg.setAttribute('height', 16);
    bg.setAttribute('rx', 3);
    bg.setAttribute('class', 'shape-edge-label-bg');
    bg.dataset.edgeId = edgeId;
    bg.style.cursor = 'pointer';
    bg.addEventListener('mouseenter', () => highlightSelf(true));
    bg.addEventListener('mouseleave', () => highlightSelf(false));
    bg.addEventListener('click', () => showEdgeDetail(e));
    edgeG.appendChild(bg);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', isTB ? lx + 6 : lx);
    t.setAttribute('y', ly + 3);
    t.setAttribute('class', 'shape-edge-label');
    t.setAttribute('text-anchor', isTB ? 'start' : 'middle');
    t.dataset.edgeId = edgeId;
    t.textContent = lbl;
    edgeG.appendChild(t);
  }
  svg.appendChild(edgeG);

  // Blocks. When shape is loaded, each block reads as a source card:
  //   name (bold) · <M phases, N transitions> · one row per container field.
  // Container fields render as pills ("hand: List of Card") inside the block
  // so the topology graph doesn't split them out as sibling atoms. Clicking
  // a block expands its phase graph in the detail pane.
  const blockG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const containerTabBounds = [];
  const depthOf = (id) => { let d = 0, cur = id; while (ownerOf.has(cur)) { d++; cur = ownerOf.get(cur); } return d; };
  for (const n of nodes) {
    const p = pos.get(n.id);
    if (!p) continue;
    const isMain = n.cls === 'CxcMain' || (n.shape && n.shape.name === _shape?.main_atom);
    // Selection may be seeded either as the node id (from a click) or as the
    // atom name (from `?expand=…`). Match both so URL-seeded selection lights
    // up the halo without needing a click.
    const isSelected = selectedNode === n.id || (n.shape && selectedNode === n.shape.name);
    // Dim unrelated blocks whenever a phase graph is open so the reader
    // sees the topology → detail relationship at a glance.
    const dimForSelection = selectedNode && !isSelected && n.id !== '(root)';
    const isOwner = childrenOf.has(n.id) && n.id !== mainNodeId;
    // isContainer: owns children in the ELK-compound hierarchy.
    // Main is always a container (it wraps everything else).
    const isContainer = childrenOf.has(n.id) || isMain;
    const clsAttr = 'shape-block' +
      (n.id === '(root)' ? ' root' : '') +
      (isMain ? ' main' : '') +
      (isOwner ? ' owner' : '') +
      (isContainer ? ' container' : '') +
      (isSelected ? ' selected' : '') +
      (dimForSelection ? ' dim-when-selected' : '');
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', p.x); rect.setAttribute('y', p.y);
    rect.setAttribute('width', p.w); rect.setAttribute('height', p.h);
    rect.setAttribute('rx', 5);
    rect.setAttribute('class', clsAttr);
    rect.dataset.nodeId = n.id;
    if (isContainer && !isMain) {
      const d = depthOf(n.id);
      if (d > 0) rect.setAttribute('fill', `rgba(74,144,217,${(0.06 + d * 0.05).toFixed(2)})`);
    }
    // Selection halo — outer glow (pale yellow) + dashed red ring. Rendered
    // behind the block. Survives headless raster (drop-shadow filters get
    // dropped). Halo + rect for the selected node are also re-appended to
    // blockG at the end so they paint above neighbors.
    if (isSelected) {
      const pad = 6;
      const glow = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      glow.setAttribute('x', p.x - pad); glow.setAttribute('y', p.y - pad);
      glow.setAttribute('width', p.w + pad*2); glow.setAttribute('height', p.h + pad*2);
      glow.setAttribute('rx', 10);
      glow.setAttribute('class', 'shape-block-halo-outer');
      blockG.appendChild(glow);
    }
    rect.addEventListener('click', () => {
      selectedNode = selectedNode === n.id ? null : n.id;
      _expandedAtom = n.shape ? n.shape.name : null;
      showNodeDetail(n, edges);
      renderShape();
    });
    rect.addEventListener('mouseenter', () => highlightShape(n.id));
    rect.addEventListener('mouseleave', () => highlightShape(null));
    rect.innerHTML = `<title>${n.shape ? n.shape.name : n.id}\n${n.size} trace events</title>`;
    blockG.appendChild(rect);

    // Title line — atom name. Container titles sit in a folder-style tab
    // above the container border; leaf titles keep their original centered
    // placement inside the pill.
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', isContainer ? p.x + 14 : p.cx);
    label.setAttribute('y', isContainer ? p.y - 19 : p.y + 24);
    label.setAttribute('class', 'shape-block-label' + (isContainer ? ' container' : '') + (isMain && isContainer ? ' main' : ''));
    label.textContent = n.id === '(root)' ? 'init' : n.label;

    if (n.id === '(root)') {
      blockG.appendChild(label);
      continue;
    }

    // Subtitle — shape summary or bare event count
    const sub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    sub.setAttribute('x', isContainer ? p.x + 14 : p.cx);
    sub.setAttribute('y', isContainer ? p.y - 19 : p.y + 42);
    sub.setAttribute('class', 'shape-block-sub' + (isContainer ? ' container' : '') + (isMain && isContainer ? ' main' : ''));
    if (n.shape) {
      const nPhases = n.shape.phases.length;
      const nTxns = n.shape.transitions.length + n.shape.self_transitions.length;
      sub.textContent = `${nPhases} phases · ${nTxns} arms`;
    } else {
      sub.textContent = n.size + ' events';
    }

    if (isContainer) {
      // Overshoot the actual char widths so the tab has real padding
      // instead of touching the label glyphs. 16px bold ~= 10px/char,
      // 12px regular ~= 7px/char, plus a 20px gutter between the two
      // runs and 14px padding at each end.
      const labelW = label.textContent.length * 10;
      const subW = sub.textContent.length * 7;
      const tabW = Math.max(200, Math.ceil(labelW + subW + 48));
      const tab = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      // Push the tab 12px above the container border (was 4) so the two
      // rects don't visually merge into one thick line.
      tab.setAttribute('x', p.x); tab.setAttribute('y', p.y - 38);
      tab.setAttribute('width', tabW); tab.setAttribute('height', 26);
      tab.setAttribute('rx', 5);
      tab.setAttribute('class', 'shape-container-tab container' +
        (isMain ? ' main' : '') +
        (isOwner ? ' owner' : '') +
        (isSelected ? ' selected' : ''));
      if (!isMain) {
        const d = depthOf(n.id);
        if (d > 0) tab.setAttribute('fill', `rgba(74,144,217,${(0.06 + d * 0.05).toFixed(2)})`);
      }
      // Tab shares the container's click / hover contract: clicking opens
      // its phase graph, hovering lights up the container + descendants.
      tab.addEventListener('mouseenter', () => highlightShape(n.id));
      tab.addEventListener('mouseleave', () => highlightShape(null));
      tab.addEventListener('click', () => {
        selectedNode = selectedNode === n.id ? null : n.id;
        _expandedAtom = n.shape ? n.shape.name : null;
        showNodeDetail(n, edges);
        renderShape();
      });
      containerTabBounds.push({ id: n.id, x: p.x, y: p.y - 38, w: tabW, h: 26 });
      sub.setAttribute('x', p.x + tabW - 14);
      sub.setAttribute('text-anchor', 'end');
      blockG.appendChild(tab);
    }
    blockG.appendChild(label);
    blockG.appendChild(sub);

    // Compact fields badge — one strip inside the block. Skipped for
    // ELK containers because the strip would obstruct the child pills
    // that sit inside the container's own bounds.
    if (n.shape && !isContainer) {
      const containerFields = n.shape.fields.filter(f => f.container_kind);
      const nContainers = containerFields.length;
      const nAtomLinks = n.shape.fields.filter(f => nodes.some(nn => nn.shape && nn.shape.name === f.type)).length;
      const nOther = n.shape.fields.length - nContainers - nAtomLinks;
      if (n.shape.fields.length > 0) {
        const badgeW = p.w - 20;
        const badgeX = p.x + 10;
        const badgeY = p.y + 52;
        const badge = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        badge.setAttribute('x', badgeX); badge.setAttribute('y', badgeY);
        badge.setAttribute('width', badgeW); badge.setAttribute('height', 16);
        badge.setAttribute('rx', 3);
        badge.setAttribute('class', 'shape-block-badge');
        blockG.appendChild(badge);
        const bt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        bt.setAttribute('x', badgeX + badgeW / 2);
        bt.setAttribute('y', badgeY + 12);
        bt.setAttribute('class', 'shape-block-badge-label');
        // Compact form: "N fields (M refs)". Refs = containers + direct
        // atom-typed fields — the hover-highlightable subset. Tooltip
        // spells out the breakdown; the visual stays block-wide-safe.
        const nFields = n.shape.fields.length;
        const nRefs = nContainers + nAtomLinks;
        bt.textContent = nRefs > 0
          ? `${nFields} field${nFields > 1 ? 's' : ''} · ${nRefs} ref${nRefs > 1 ? 's' : ''}`
          : `${nFields} field${nFields > 1 ? 's' : ''}`;
        const tip = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        tip.textContent = [
          nContainers ? `${nContainers} container field${nContainers > 1 ? 's' : ''}` : null,
          nAtomLinks  ? `${nAtomLinks} atom-typed field${nAtomLinks > 1 ? 's' : ''}` : null,
          nOther      ? `${nOther} scalar field${nOther > 1 ? 's' : ''}` : null,
        ].filter(Boolean).join(' · ');
        badge.appendChild(tip);
        blockG.appendChild(bt);
        // Hover on badge highlights every atom this block references via
        // its List-of / Set-of / atom-typed fields. Fills in for the pill
        // hover we lose by collapsing to a summary.
        const linkedIds = new Set([n.id]);
        for (const f of n.shape.fields) {
          const inner = /^(?:List|Set) of (.+)$/.exec(f.type);
          const targetName = inner ? inner[1] : f.type;
          const target = nodes.find(nn => nn.shape && nn.shape.name === targetName);
          if (target) linkedIds.add(target.id);
        }
        if (linkedIds.size > 1) {
          badge.style.cursor = 'pointer';
          badge.addEventListener('mouseenter', () => highlightShape([...linkedIds]));
          badge.addEventListener('mouseleave', () => highlightShape(null));
        }
      }
    }
  }
  svg.appendChild(blockG);
  stage.appendChild(svg);

  // If a block is selected, render its phase graph in the detail pane and
  // scroll the topology so the selected node sits in view — otherwise the
  // "which atom is this?" question is answered only by the panel header.
  if (_expandedAtom && _shape) {
    const atomShape = _shape.atoms.find(a => a.name === _expandedAtom);
    if (atomShape) renderPhaseGraph(atomShape);
    if (selectedNode) {
      // Selection may be a node id (from click) or an atom name (from ?expand).
      // Try id first, then walk nodes for the atom-name match.
      let selEl = stage.querySelector(`.shape-block[data-node-id="${CSS.escape(selectedNode)}"]`);
      if (!selEl) {
        const atomNode = nodes.find(nn => nn.shape && nn.shape.name === selectedNode);
        if (atomNode) selEl = stage.querySelector(`.shape-block[data-node-id="${CSS.escape(atomNode.id)}"]`);
      }
      if (selEl && typeof selEl.scrollIntoView === 'function') {
        requestAnimationFrame(() => selEl.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' }));
      }
    }
  }
}

function highlightShape(hoverIds) {
  const stage = $('stage-main');
  if (!stage) return;
  const svg = stage.querySelector('svg');
  if (!svg) return;
  svg.querySelectorAll('.shape-block').forEach(el => el.classList.remove('dim', 'hover'));
  svg.querySelectorAll('.shape-edge').forEach(el => el.classList.remove('dim'));
  if (!hoverIds) return;
  const set = new Set(Array.isArray(hoverIds) ? hoverIds : [hoverIds]);
  svg.querySelectorAll('.shape-block').forEach(el => {
    if (set.has(el.dataset.nodeId)) el.classList.add('hover');
    else el.classList.add('dim');
  });
  svg.querySelectorAll('.shape-edge').forEach(el => {
    if (!set.has(el.dataset.src) && !set.has(el.dataset.dst)) el.classList.add('dim');
  });
}

// ===== TIMELINE VIEW (seq-based x-axis) =====
function renderTimeline() {
  const stage = $('stage-main');
  stage.innerHTML = '';
  if (!filtered.length) { stage.innerHTML = '<div id="empty-state">No events after filters.</div>'; return; }
  const targets = [...new Set(filtered.map(e => e.target))];
  const targetIndex = new Map(targets.map((t, i) => [t, i]));
  const targetCls = new Map();
  filtered.forEach(e => { if (!targetCls.has(e.target)) targetCls.set(e.target, e.target_cls); });
  const laneH = 28;
  const leftPad = 200;
  const totalH = targets.length * laneH + 24;
  // Seq-based x: equal spacing per event, cap at stage width * 3
  const stageW = stage.clientWidth;
  const perEventPx = Math.max(2, Math.min(6, (stageW * 3 - leftPad - 20) / filtered.length));
  const width = Math.max(stageW, leftPad + 20 + filtered.length * perEventPx);
  const xForSeq = i => leftPad + i * perEventPx;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', width);
  svg.setAttribute('height', totalH);
  let parts = [];
  targets.forEach((tgt, i) => {
    const y = 12 + i * laneH;
    parts.push(`<rect class="${i%2 ? 'lane-alt' : 'lane'}" x="0" y="${y}" width="${width}" height="${laneH-2}"></rect>`);
    const cls = targetCls.get(tgt) || '?';
    parts.push(`<text class="lane-label" x="4" y="${y+16}">${escapeHtml(cls)} <tspan fill="#999">[${tgt}]</tspan></text>`);
  });
  filtered.forEach((e, i) => {
    const laneI = targetIndex.get(e.target);
    const y = 12 + laneI * laneH + 14;
    const x = xForSeq(i);
    parts.push(`<circle class="evt-${escapeHtml(e.kind)}" cx="${x}" cy="${y}" r="3" data-seq="${e.seq}"><title>seq ${e.seq} ${escapeHtml(e.kind)}: ${escapeHtml(e.msg)}</title></circle>`);
  });
  svg.innerHTML = parts.join('');
  wireCanvasClicks(svg);
  stage.appendChild(svg);
}

// ===== SEQUENCE VIEW (compacted) =====
// Instead of one row per event, one row per contiguous run of events
// on the same atom. Each run condenses to `<atom> [msg1, msg2, ...]`.
function renderSequence() {
  const stage = $('stage-main');
  stage.innerHTML = '';
  if (!filtered.length) { stage.innerHTML = '<div id="empty-state">No events after filters.</div>'; return; }
  // Group into runs
  const runs = [];
  for (const e of filtered) {
    const last = runs[runs.length - 1];
    if (last && last.target === e.target) {
      last.events.push(e);
    } else {
      runs.push({target: e.target, target_cls: e.target_cls, events: [e]});
    }
  }
  const targets = [...new Set(filtered.map(e => e.target))];
  const targetIndex = new Map(targets.map((t, i) => [t, i]));
  const targetCls = new Map();
  filtered.forEach(e => { if (!targetCls.has(e.target)) targetCls.set(e.target, e.target_cls); });
  const colW = Math.max(140, Math.min(220, (stage.clientWidth - 40) / targets.length));
  const rowH = 24;
  const topPad = 40;
  const totalW = targets.length * colW + 40;
  const totalH = topPad + runs.length * rowH + 20;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  let parts = [];
  targets.forEach((t, i) => {
    const cx = 20 + i * colW + colW/2;
    parts.push(`<line x1="${cx}" y1="${topPad}" x2="${cx}" y2="${totalH-10}" stroke="#ddd"></line>`);
    parts.push(`<text class="lane-label" x="${cx}" y="18" text-anchor="middle" style="font-weight:600;">${escapeHtml(targetCls.get(t)||'?')}</text>`);
    parts.push(`<text class="lane-label" x="${cx}" y="32" text-anchor="middle" style="fill:#888; font-size:9px;">[${t}]</text>`);
  });
  const runPos = new Map(); // for arrow drawing: first event seq → pos
  runs.forEach((run, i) => {
    const y = topPad + i * rowH + rowH/2;
    const cx = 20 + targetIndex.get(run.target) * colW + colW/2;
    // A compact horizontal cluster of dots for the run
    const evs = run.events;
    const spread = Math.min(colW - 40, evs.length * 6);
    evs.forEach((e, j) => {
      const dx = evs.length === 1 ? 0 : (-spread/2 + (j / (evs.length - 1)) * spread);
      const ex = cx + dx;
      parts.push(`<circle class="evt-${escapeHtml(e.kind)}" cx="${ex}" cy="${y}" r="3.5" data-seq="${e.seq}"><title>seq ${e.seq} ${escapeHtml(e.kind)}: ${escapeHtml(e.msg)}</title></circle>`);
      runPos.set(e.seq, {x: ex, y});
    });
    // Label: first msg + count
    const firstMsg = (evs[0].msg || '').split('.').pop();
    const label = evs.length === 1 ? firstMsg : `${firstMsg} (+${evs.length - 1})`;
    parts.push(`<text x="${cx + spread/2 + 6}" y="${y + 3}" style="font-size:10px; fill:#555;">${escapeHtml(label)}</text>`);
  });
  // Arrows for send→recv within filter
  if ($('show-arrows').checked) {
    const {pairs, unclosed} = analysis();
    const inFilter = new Set(filtered.map(e => e.seq));
    pairs.forEach(({send, recv}) => {
      if (!inFilter.has(send.seq) || !inFilter.has(recv.seq)) return;
      const s = runPos.get(send.seq), r = runPos.get(recv.seq);
      if (!s || !r) return;
      parts.push(`<path class="arrow" d="M${s.x},${s.y} L${r.x},${r.y}"></path>`);
    });
    unclosed.forEach(s => {
      if (!inFilter.has(s.seq)) return;
      const p = runPos.get(s.seq);
      if (!p) return;
      parts.push(`<path class="arrow-unclosed" d="M${p.x},${p.y} L${p.x+30},${p.y+30}"></path>`);
    });
  }
  svg.innerHTML = parts.join('');
  wireCanvasClicks(svg);
  stage.appendChild(svg);
}

// ===== PER-ATOM INBOX =====
function renderInbox() {
  const stage = $('stage-main');
  stage.innerHTML = '';
  const byTarget = new Map();
  filtered.forEach(e => {
    if (!byTarget.has(e.target)) byTarget.set(e.target, {cls: e.target_cls, evs: []});
    byTarget.get(e.target).evs.push(e);
  });
  const rows = [];
  for (const [tgt, {cls, evs}] of byTarget) {
    const c = {send: 0, recv: 0, arm: 0, no_arm: 0, send_sync: 0, recv_sync: 0, send_dropped: 0};
    evs.forEach(e => { c[e.kind] = (c[e.kind]||0)+1; });
    const sendTot = (c.send||0) + (c.send_sync||0);
    const recvTot = (c.recv||0) + (c.recv_sync||0);
    rows.push({tgt, cls, sendTot, recvTot, arm: c.arm||0, no_arm: c.no_arm||0, imbal: sendTot - recvTot});
  }
  rows.sort((a,b) => Math.abs(b.imbal) - Math.abs(a.imbal) || b.arm - a.arm);
  const container = document.createElement('div');
  container.style.padding = '12px';
  let html = '<table style="width:100%; border-collapse:collapse;">';
  html += '<thead style="position:sticky; top:0; background:white; z-index:1;"><tr>';
  html += '<th style="text-align:left; padding:6px; border-bottom:2px solid #333;">atom</th>';
  html += '<th style="text-align:right; padding:6px; border-bottom:2px solid #333;">sends in</th>';
  html += '<th style="text-align:right; padding:6px; border-bottom:2px solid #333;">recvs</th>';
  html += '<th style="text-align:right; padding:6px; border-bottom:2px solid #333;">arms fired</th>';
  html += '<th style="text-align:right; padding:6px; border-bottom:2px solid #333;">no_arm</th>';
  html += '<th style="text-align:right; padding:6px; border-bottom:2px solid #333;">imbalance</th>';
  html += '</tr></thead><tbody>';
  for (const r of rows) {
    const warn = r.imbal !== 0 ? ' style="color:#c33; font-weight:600;"' : '';
    const noArmWarn = r.no_arm > 0 ? ' style="color:#c33; font-weight:600;"' : '';
    html += `<tr style="border-bottom:1px solid #eee;">
      <td style="padding:6px;">${escapeHtml(r.cls)} <span style="color:#999;">[${r.tgt}]</span></td>
      <td style="text-align:right; padding:6px;">${r.sendTot}</td>
      <td style="text-align:right; padding:6px;">${r.recvTot}</td>
      <td style="text-align:right; padding:6px;">${r.arm}</td>
      <td style="text-align:right; padding:6px;"${noArmWarn}>${r.no_arm}</td>
      <td style="text-align:right; padding:6px;"${warn}>${r.imbal}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  container.innerHTML = html;
  stage.appendChild(container);
}

function wireCanvasClicks(svg) {
  svg.addEventListener('click', (ev) => {
    const t = ev.target;
    if (t.dataset && t.dataset.seq) {
      const e = events.find(x => x.seq == t.dataset.seq);
      showDetail(e);
    }
  });
}

function render() {
  if (!events.length) return;
  if (currentView === 'graph') renderGraph();
  else if (currentView === 'shape') renderShape();
  else if (currentView === 'timeline') renderTimeline();
  else if (currentView === 'sequence') renderSequence();
  else if (currentView === 'inbox') renderInbox();
}

function setView(view) {
  currentView = view;
  ['graph','shape','timeline','sequence','inbox'].forEach(v => {
    $('view-' + v).classList.toggle('on', v === view);
  });
  $('shape-controls').style.display = view === 'shape' ? 'inline-flex' : 'none';
  render();
}

['graph','shape','timeline','sequence','inbox'].forEach(v => {
  $('view-' + v).addEventListener('click', () => setView(v));
});
$('show-arrows').addEventListener('change', render);
$('graph-aggregate').addEventListener('change', render);
$('shape-orient').addEventListener('change', render);
$('shape-expand').addEventListener('change', render);
$('shape-show-containers').addEventListener('change', render);
const shapeShowInit = $('shape-show-init');
shapeShowInit.checked = localStorage.getItem('cxc-shape-show-init') === '1';
shapeShowInit.addEventListener('change', () => {
  localStorage.setItem('cxc-shape-show-init', shapeShowInit.checked ? '1' : '0');
  renderShape();
});
$('seq-range').addEventListener('input', applyFilters);
window.addEventListener('resize', () => render());

// Drop wiring
const drop = $('drop');
drop.addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (f) f.text().then(t => loadTrace(t, f.name));
});
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('hover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
drop.addEventListener('drop', (e) => {
  e.preventDefault();
  drop.classList.remove('hover');
  const f = e.dataTransfer.files[0];
  if (f) f.text().then(t => loadTrace(t, f.name));
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) f.text().then(t => loadTrace(t, f.name));
});

const params = new URLSearchParams(window.location.search);
const viewParam = params.get('view');
if (viewParam && ['graph','shape','timeline','sequence','inbox'].includes(viewParam)) {
  setView(viewParam);
}
if (params.get('shape-orient')) $('shape-orient').value = params.get('shape-orient');
if (params.get('shape-expand') === '1') $('shape-expand').checked = true;
if (params.get('shape-show-containers') === '1') $('shape-show-containers').checked = true;
if (!viewParam) setView('shape');
// `?expand=<atom-name>` opens the phase graph for that atom on load — useful
// for screenshots, bookmarks, and deep-linking a specific lifecycle. When set
// we also seed `selectedNode` so the topology halo lights up; loadShape's
// render pass resolves the node id via the atom-name match.
const expandParam = params.get('expand');
if (expandParam) { _expandedAtom = expandParam; selectedNode = expandParam; }

// Try to load a companion shape sidecar. Precedence:
//   1. explicit ?shape=<path> — user pins a specific sidecar
//   2. derived from the trace path — swap `.trace.jsonl`/`.jsonl` for
//      `.shape.json`; matches the cxc build output layout
//   3. `<trace-basename>.shape.json` — for `.current-trace.jsonl` etc.
// A 404 is fine — the viewer degrades to Phase 1 topology inference.
function deriveShapePath(tracePath) {
  if (!tracePath) return null;
  if (tracePath.endsWith('.trace.jsonl')) return tracePath.replace(/\.trace\.jsonl$/, '.shape.json');
  if (tracePath.endsWith('.jsonl'))       return tracePath.replace(/\.jsonl$/, '.shape.json');
  return tracePath + '.shape.json';
}
function loadShape(url) {
  return fetch(url, {cache: 'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(j => { _shape = j; if (j) { $('status').textContent += ` · shape: ${j.atoms.length} atoms`; } render(); })
    .catch(() => { _shape = null; });
}
if (params.has('trace')) {
  const tp = params.get('trace');
  fetch(tp).then(r => r.text()).then(t => {
    loadTrace(t, tp);
    const shapeUrl = params.get('shape') || deriveShapePath(tp);
    if (shapeUrl) loadShape(shapeUrl);
  });
}

// Draggable splitter between #stage-main and #stage-detail. Only usable
// while the phase panel is open (splitter is display:none otherwise).
// Persists user-chosen height to localStorage so the pane stays where the
// user left it across reloads. Double-click resets to 55vh default.
(function wireSplitter() {
  const splitter = document.getElementById('stage-splitter');
  const detail = document.getElementById('stage-detail');
  if (!splitter || !detail) return;
  // Restore persisted height on open.
  const saved = localStorage.getItem('cxc-phase-pane-h');
  if (saved) detail.style.height = saved + 'px';
  let dragging = false;
  splitter.addEventListener('mousedown', (e) => {
    if (!document.body.classList.contains('phase-panel-open')) return;
    dragging = true;
    splitter.classList.add('dragging');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const wh = window.innerHeight;
    const newH = Math.max(200, Math.min(wh - 120, wh - e.clientY - 3));
    detail.style.height = newH + 'px';
    localStorage.setItem('cxc-phase-pane-h', String(newH));
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
  splitter.addEventListener('dblclick', () => {
    detail.style.height = '';   // fall back to CSS default (55vh)
    localStorage.removeItem('cxc-phase-pane-h');
  });
})();

// Left-drag anywhere pans the shape SVG by shifting its viewBox origin.
// Works at any zoom level — including <100% where the SVG fits inside
// the stage and scroll bars wouldn't help. On non-shape views (timeline,
// sequence, phase graph SVGs without dataset.nativeW), pan falls back
// to scrollLeft/scrollTop so those still pan when zoomed to overflow.
// Interactive descendants (legend, zoom UI, hint, close, splitter) skip
// pan. Drag <4px = click passthrough; >=4px pans and swallows the click.
(function wirePan() {
  const stage = document.getElementById('stage-main');
  if (!stage) return;
  let active = false, sx = 0, sy = 0, moved = false;
  let initSL = 0, initST = 0;
  let initPX = 0, initPY = 0, initZ = 1;
  let viewBoxMode = false;
  const skipSel = '#shape-legend, #shape-zoom, #shape-hint, #stage-splitter, .detail-close-btn';
  const svgSel = () => stage.querySelector('svg');
  const swallowNextClick = (ev) => { ev.stopPropagation(); ev.preventDefault(); stage.removeEventListener('click', swallowNextClick, true); };
  stage.addEventListener('mousedown', (ev) => {
    if (ev.button !== 0) return;
    if (ev.target.closest && ev.target.closest(skipSel)) return;
    active = true; moved = false;
    sx = ev.clientX; sy = ev.clientY;
    const svgEl = svgSel();
    viewBoxMode = !!(svgEl && svgEl.dataset.nativeW);
    if (viewBoxMode) {
      initZ = parseFloat(localStorage.getItem('cxc-shape-zoom')) || 1;
      initPX = parseFloat(localStorage.getItem('cxc-shape-panx')) || 0;
      initPY = parseFloat(localStorage.getItem('cxc-shape-pany')) || 0;
    } else {
      initSL = stage.scrollLeft; initST = stage.scrollTop;
    }
  });
  window.addEventListener('mousemove', (ev) => {
    if (!active) return;
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    if (!moved) { moved = true; stage.classList.add('panning'); }
    if (viewBoxMode) {
      const svgEl = svgSel();
      if (!svgEl || !svgEl.dataset.nativeW) return;
      const nW = +svgEl.dataset.nativeW, nH = +svgEl.dataset.nativeH;
      const rect = svgEl.getBoundingClientRect();
      const vbW = nW / initZ, vbH = nH / initZ;
      const newPX = initPX - dx * (vbW / rect.width);
      const newPY = initPY - dy * (vbH / rect.height);
      svgEl.setAttribute('viewBox', `${newPX} ${newPY} ${vbW} ${vbH}`);
      localStorage.setItem('cxc-shape-panx', String(newPX));
      localStorage.setItem('cxc-shape-pany', String(newPY));
    } else {
      stage.scrollLeft = initSL - dx;
      stage.scrollTop  = initST - dy;
    }
    ev.preventDefault();
  });
  window.addEventListener('mouseup', () => {
    if (!active) return;
    const wasMoved = moved;
    active = false; moved = false;
    stage.classList.remove('panning');
    if (wasMoved) stage.addEventListener('click', swallowNextClick, true);
  });
})();
</script>
