<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cxc trace viewer</title>
  <!-- gap 57: same font families and weights as legacy. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --p-bg:     #FBF4E7;  --p-ink:    #22160A;
      --p-dim:    #6E604A;  --p-accent: #B65A2A;
      /* aliases for shape-canvas rules copied from the legacy viewer */
      --p-paper:  #FBF4E7;  --p-paper2: #F2E8D2;  --p-paper3: #E7D9BA;
      --p-ink2:   #6E604A;  --p-ink3:   #988872;  --p-hair: #D6C6A8;
      --p-sepia:  #EAD6AF;  --p-wash:   #FAE8CB;
      --p-amber:  #D08A3A;  --p-indigo: #4F5B8C;  --p-rust: #8A4225;
    }
    body.theme-dark {
      color-scheme: dark;
      --p-bg:     #1E1E22;  --p-ink:    #E6E6EA;
      --p-dim:    #A4A4AC;  --p-accent: #E89B88;
      --p-paper:  #1E1E22;  --p-paper2: #2A2A2E;  --p-paper3: #36363B;
      --p-ink2:   #A4A4AC;  --p-ink3:   #74747C;  --p-hair: #48484F;
      --p-sepia:  #C9A47B;  --p-wash:   rgba(232,155,136,.16);
      --p-amber:  #E8CF95;  --p-indigo: #8DB4E0;  --p-rust: #E8A685;
    }
    #theme-toggle {
      position: fixed; top: 8px; right: 8px; z-index: 50;
      background: var(--p-bg); color: var(--p-ink);
      border: 0.75px solid var(--p-ink); border-radius: 0;
      font-family: 'IBM Plex Mono', monospace;
      width: 28px; height: 28px; font-size: 18px; letter-spacing: 0;
      padding: 0; cursor: pointer;
    }
    #theme-toggle:hover { background: var(--p-paper2); }

    #shape-zoom { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px;
      align-items: center; background: var(--p-bg); border: 0.75px solid var(--p-ink); padding: 3px 6px;
      font-family: 'IBM Plex Mono', monospace; font-size: 10px; z-index: 4; }
    #shape-zoom button { background: transparent; color: var(--p-ink);
      border: 0.5px solid var(--p-ink); font: inherit; font-size: 13px; line-height: 1;
      min-width: 28px; min-height: 28px; padding: 0 8px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; }
    #shape-zoom button:hover { background: var(--p-ink); color: var(--p-bg); }
    #shape-zoom-level { min-width: 40px; text-align: center; color: var(--p-ink2);
      letter-spacing: .1em; align-self: center; font-variant-numeric: tabular-nums; padding: 0 2px; }
    #shape-container.panning { cursor: grabbing; user-select: none; }
    #shape-container.panning * { pointer-events: none; }
    #shape-container { cursor: grab; }

    #shape-legend, #shape-legend-reopen { position: absolute; bottom: 60px; left: 12px;
      background: var(--p-bg); border: 0.75px solid var(--p-ink); padding: 8px 12px;
      font-family: 'IBM Plex Mono', monospace; font-size: 10px; z-index: 5; }
    #shape-legend-reopen { padding: 4px 8px; cursor: pointer;
      font: 11px 'IBM Plex Mono', monospace; letter-spacing: 0; color: var(--p-ink); }
    #shape-legend h5 { margin: 0 0 4px; font-size: 10px; text-transform: uppercase;
      letter-spacing: .3em; color: var(--p-ink2); font-weight: 700; }
    #shape-legend .legend-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    #shape-legend .legend-swatch { width: 14px; height: 10px; flex-shrink: 0;
      border: 0.5px solid var(--p-hair); }
    #shape-legend .legend-line { width: 22px; height: 0; flex-shrink: 0; }
    #shape-legend .legend-line.legend-self-dash { border-top: 0;
      background: linear-gradient(to right, var(--p-rust) 60%, transparent 0) repeat-x;
      background-size: 7px 1.6px; height: 1.6px; }
    #shape-legend .legend-group + .legend-group { margin-top: 6px; padding-top: 6px;
      border-top: 0.5px dashed var(--p-hair); }
    #shape-legend-close { position: absolute; top: 2px; right: 4px; background: none;
      border: 0; cursor: pointer; color: var(--p-ink2); padding: 2px 4px; }
    #drop { border: 1px dashed var(--p-ink); padding: 14px;
      text-align: center; font-size: 10px; letter-spacing: 0; text-transform: uppercase;
      color: var(--p-ink); cursor: pointer; }
    #drop .drop-sub { color: var(--p-ink2); font-size: 10px; }
    #drop:hover, #drop.dragging { border-color: var(--p-accent); color: var(--p-ink); }

    .filters { font-size: 11px; }
    .filters .filter-group { padding: 4px 0; border-top: 1px dotted var(--p-dim); }
    .filters .filter-head { color: var(--p-dim); font-size: 10px;
      text-transform: uppercase; letter-spacing: .1em; margin-bottom: 2px; }
    .filters .filter { display: block; padding: 2px 0; font-size: 11px; }
    .filters .filter-label { display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--p-dim); }
    .filters .filter-input { background: transparent; border: 1px solid var(--p-dim);
      color: var(--p-ink); font: inherit; padding: 2px 4px; width: 90px; }

    #annotate-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 55; }
    #annotate-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto;
      background: var(--p-bg); border: 0.75px solid var(--p-ink);
      padding: 14px 16px; z-index: 60; font-size: 11px; color: var(--p-ink);
      box-shadow: 0 2px 16px rgba(0,0,0,.3); font-family: 'IBM Plex Mono', monospace; }
    #annotate-popup .popup-title { font-family: 'Barlow Condensed', Impact, sans-serif;
      letter-spacing: .25em; text-transform: uppercase; font-size: 12px;
      margin-bottom: 8px; color: var(--p-ink2); }
    #annotate-popup .popup-target { color: var(--p-ink2); font-size: 10px;
      letter-spacing: .1em; margin-bottom: 8px; }
    #annotate-popup .popup-target span { color: var(--p-ink); word-break: break-all;
      text-transform: none; }
    #annotate-note { width: 100%; font: inherit; padding: 6px 8px;
      border: 0.5px solid var(--p-ink2); background: var(--p-bg); color: var(--p-ink);
      resize: vertical; box-sizing: border-box; min-height: 110px; }
    #annotate-popup .popup-attachments { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    #annotate-popup .popup-att { padding: 3px 6px; border: 0.5px solid var(--p-ink2);
      font-size: 10px; display: inline-flex; align-items: center; gap: 4px; }
    #annotate-popup .popup-att img { max-width: 72px; max-height: 72px; display: block; }
    #annotate-popup .popup-att-remove { background: none; border: 0; cursor: pointer;
      color: var(--p-ink); font: inherit; padding: 0 4px; }
    #annotate-popup .popup-actions { display: flex; gap: 8px; justify-content: flex-end;
      margin-top: 10px; align-items: center; }
    #annotate-popup .popup-hint { margin-right: auto; color: var(--p-ink2); font-size: 10px; }
    #annotate-popup button { background: transparent; color: var(--p-ink);
      border: 1px solid var(--p-ink); font: inherit; padding: 3px 10px; cursor: pointer; }
    #annotate-popup button.primary { background: var(--p-accent); color: var(--p-bg); border-color: var(--p-accent); }

    .ann-top-actions { display: flex; gap: 8px; align-items: center; padding: 6px 0;
      border-bottom: 1px dotted var(--p-dim); flex-wrap: wrap; }
    .drafts-controls { display: inline-flex; gap: 6px; align-items: center; margin-left: auto;
      font-size: 11px; color: var(--p-dim); }

    .ann-comments { margin-top: 6px; }
    .ann-comments-list { list-style: none; margin: 0; padding: 0; }
    .ann-comment { font-size: 11px; padding: 4px 0; border-top: 0.5px dotted var(--p-dim); }
    .ann-comment .c-author { color: var(--p-accent); font-weight: 600; }
    .ann-comment .c-at { color: var(--p-dim); font-size: 9px; }
    .ann-reply textarea { width: 100%; font: 11px 'IBM Plex Mono', monospace;
      padding: 4px 6px; border: 0.5px solid var(--p-dim); background: var(--p-bg);
      color: var(--p-ink); resize: vertical; min-height: 60px; box-sizing: border-box; }
    .ann-reply .reply-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
    .btn.reply-open { font-size: 10px; padding: 2px 6px; margin-top: 4px; }
    .btn.primary { background: var(--p-accent); color: var(--p-bg); border-color: var(--p-accent); }

    #atom-detail { margin: 14px; border-top: 1px solid var(--p-dim); padding-top: 10px; }
    #atom-detail .atom-detail-header { display: flex; align-items: baseline; gap: 10px;
      padding-bottom: 6px; margin-bottom: 6px; }
    #atom-detail .atom-detail-name { font-family: 'Barlow Condensed', Impact, sans-serif;
      font-weight: 700; font-size: 15px; letter-spacing: .08em; color: var(--p-ink);
      text-transform: uppercase; }
    #atom-detail .atom-detail-summary { color: var(--p-ink2); font-size: 11px;
      font-family: 'IBM Plex Mono', monospace; }
    #atom-detail .btn { margin-left: 8px; font-size: 10px; padding: 2px 8px; }
    #atom-detail .btn.close { margin-left: auto; }
    #atom-detail .focus-toolbar { display: inline-flex; gap: 4px; margin-left: 12px; }
    #atom-detail .phase-graph-container { overflow: auto; max-height: 420px;
      border: 1px dotted var(--p-dim); background: var(--p-bg); padding: 12px; }


    .chat-excerpt-loading, .chat-excerpt-error { font-style: italic; color: var(--p-ink2);
      font-size: 10px; padding: 4px 6px; border-left: 2px solid var(--p-indigo); }
    .chat-excerpt-error { color: var(--p-accent); border-left-color: var(--p-accent); }
    .chat-excerpt-hit { margin: 4px 0; padding: 4px 0; border-top: 0.5px dashed var(--p-dim); }
    .chat-excerpt-hit:first-child { border-top: 0; }
    .chat-excerpt-meta { color: var(--p-ink2); font-size: 9px; margin-bottom: 2px; }
    .chat-excerpt-text { white-space: pre-wrap; font-size: 10px; }

    body.hide-sidebar .main { grid-template-columns: 1fr; }
    body.hide-sidebar .stats { display: none; }
    body.hide-chrome header,
    body.hide-chrome #theme-toggle,
    body.hide-chrome #shape-zoom,
    body.hide-chrome #shape-legend,
    body.hide-chrome #shape-legend-reopen,
    body.hide-chrome .stage-toolbar,
    body.hide-chrome .pt-transport { display: none !important; }
    /* gap 66: chrome-free embedding retains the graph and inspection pane. */
    body.hide-chrome .main { grid-template-columns: minmax(0, 1fr); padding: 0; gap: 0; }
    body.hide-chrome .stats, body.hide-chrome #sidebar-toggle,
    body.hide-chrome #shape-hint { display: none !important; }
    /* gap 59: native collapsible headings and all-status groups. */
    details { margin: 16px 0 0; }
    #sidebar summary, details summary { cursor: pointer; color: var(--p-ink);
      font-family: 'Barlow Condensed', Impact, sans-serif; font-weight: 700; font-size: 13px;
      letter-spacing: .08em; text-transform: uppercase; border-bottom: 0.5px solid var(--p-ink);
      padding: 4px 0; margin-bottom: 6px; }
    #sidebar details > summary { display: flex; align-items: center; gap: 6px;
      min-height: 34px; line-height: 24px; list-style: none; }
    #sidebar details > summary::-webkit-details-marker { display: none; }
    #sidebar details > summary::marker { content: ''; }
    #sidebar details > summary::before { content: '▸'; flex: 0 0 10px;
      font-family: ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 400;
      letter-spacing: 0; line-height: 24px; text-align: center; color: var(--p-ink2); }
    #sidebar details[open] > summary::before { content: '▾'; }
    .ann-status-heading { margin: 8px 0 2px; font-size: 11px; text-transform: uppercase; }

    /* gaps 47/48: small first-use hint and whole-trace heat key. */
    #shape-hint { position: absolute; top: 12px; left: 12px; max-width: calc(100% - 290px);
      background: var(--p-paper); border: 1px solid var(--p-ink); padding: 4px 10px;
      font: 10px 'IBM Plex Mono', monospace; letter-spacing: .1em; line-height: 1.5;
      color: var(--p-ink2); box-sizing: border-box; z-index: 4; }
    #shape-hint button { background: none; color: var(--p-ink); border: 0; cursor: pointer; }
    #shape-hint b { color: var(--p-ink); font-weight: 600; }
    #shape-hint .dismiss { margin-left: 8px; padding: 0 4px; vertical-align: middle; }
    .legend-heat-ramp { height: 8px; background: linear-gradient(to right, #f9e6c7, #d88555, #752f23); }
    .phase-legend { color: var(--p-dim); font: 10px 'IBM Plex Mono', monospace; }

    /* gap 55: compact cached excerpts with a reversible expansion control. */
    .chat-excerpt-body.compact { max-height: 100px; overflow: hidden; }
    .chat-excerpt-body.expanded { max-height: none; }

    /* gap 65: visible keyboard focus and legacy 28px control targets. */
    button, select, input:not([type=checkbox]), summary, [role=button] { min-height: 28px; box-sizing: border-box; }
    button { min-width: 28px; }
    #shape-legend-close, #shape-hint .dismiss, .icon-button, #theme-toggle {
      min-width: 28px; min-height: 28px; font-size: 18px; line-height: 1; letter-spacing: 0;
      display: inline-flex; align-items: center; justify-content: center; }
    :is(button, input, select, textarea, a, summary, [tabindex]):focus-visible {
      outline: 2px solid var(--p-accent); outline-offset: 2px; }

    html,body { margin:0; padding:0; background:var(--p-bg); color:var(--p-ink);
      font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; letter-spacing: .02em; }
    body { line-height: 1.5; color-scheme: light; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
      border-bottom: 0.75px solid var(--p-ink); }
    header h1 { margin: 0; font-family: 'Barlow Condensed', Impact, sans-serif; font-size: 16px;
      font-weight: 700; letter-spacing: .3em; text-transform: uppercase; flex-shrink: 0; }
    header .status { color: var(--p-ink2); font-size: 10px; letter-spacing: .2em;
      text-transform: uppercase; min-width: 0; margin-right: 36px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    #sidebar .trace-name { display: block; margin: 10px 0 0; font-size: 11px;
      overflow-wrap: anywhere; color: var(--p-ink); }
    .loading, .empty, .error { padding: 24px; color: var(--p-dim); }
    .error { color: var(--p-accent); font-family: 'IBM Plex Mono', monospace; }
    /* gap 20: viewport stage, independently scrolling inspection/review pane. */
    html, body, #app { height: 100%; }
    #app-root { height: 100dvh; display: flex; flex-direction: column; }
    #app-root > header { flex: none; }
    .main { display: grid; grid-template-columns: 280px minmax(0, 1fr);
      position: relative; --sidebar-width: 280px; min-height: 0; flex: 1; }
    .stats { overflow: auto; min-height: 0; }
    #sidebar { background: var(--p-paper2); padding: 14px 14px 20px;
      border-right: 0.75px solid var(--p-ink); box-sizing: border-box; }
    .workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .stat-row { display:flex; justify-content:space-between; padding: 3px 0;
      font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .08em; font-weight: 400; }
    .stat-row .k { color: var(--p-dim); }
    .stat-row .v { font-weight: 400; }
    .diagnostics { font-size: 11px; }
    .stage-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
      flex: none; padding: 8px 14px; background: var(--p-paper); border-bottom: 0.75px solid var(--p-ink); }
    .stage-toolbar label { display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--p-ink2); }
    .stage-toolbar input, .stage-toolbar select { background: var(--p-paper); color: var(--p-ink);
      border: 0.75px solid var(--p-ink); border-radius: 0; font: 10px 'IBM Plex Mono', monospace;
      padding: 3px 6px; letter-spacing: .1em; }
    .stage-toolbar input[type=checkbox] { accent-color: var(--p-indigo); }
    .stage-toolbar input::placeholder { color: var(--p-ink2); opacity: 1; }
    .stage-toolbar .filter-input { width: 90px; }
    .stage-toolbar .toolbar-spacer { flex: 1; }
    .stage-toolbar .heat-toggle { padding: 0; }
    .stage-toolbar .heat-ramp { display: none; }
    body.heatmap-on .stage-toolbar .heat-ramp { display: inline; }
    .advanced-layouts { position: relative; margin: 0; }
    .advanced-layouts .layout-controls { position: absolute; top: calc(100% + 5px); left: 0;
      z-index: 35; display: flex; flex-direction: column; gap: 8px; width: 220px;
      max-width: calc(100vw - 32px); padding: 10px; background: var(--p-paper);
      border: 0.75px solid var(--p-hair); box-sizing: border-box; }
    .advanced-layouts .layout-controls label { justify-content: space-between; }
    .shape-stage { flex: 1; min-height: 100px;
      background: var(--p-paper); position: relative; /* gap 58 */ }
    .shape-container { position: absolute; inset: 0; overflow: hidden; }
    .shape-container svg { display: block; width: 100%; height: 100%; }
    .pt-transport { flex-wrap: wrap; justify-content: center; max-width: calc(100% - 28px); }
    @media (max-width: 720px) {
      .main { grid-template-columns: 220px minmax(0, 1fr); --sidebar-width: 220px; }
    }
    /* gap 19: reachable when collapsed, including keyboard shortcut. */
    #sidebar-toggle { position: absolute; left: calc(var(--sidebar-width) - 16px); top: 12px; z-index: 51;
      width: 32px; height: 32px; opacity: .35; background: var(--p-paper2);
      border: 0.5px solid var(--p-ink3); color: var(--p-ink2); font: 10px 'IBM Plex Mono', monospace;
      letter-spacing: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    #sidebar-toggle:hover, #sidebar-toggle:focus-visible { opacity: 1; color: var(--p-ink); background: var(--p-paper3); }
    body.hide-sidebar #sidebar-toggle { left: 0; }
    .annotations { font-size: 11px; }
    .annotations .title { flex: 1; }
    .annotations .ann-count { color: var(--p-dim); font-family: 'IBM Plex Mono', monospace; }
    .annotations .ann-filters { display:flex; flex-wrap:wrap; gap: 4px; padding: 6px 0; }
    .annotations .ann-filter { font-size: 11px; padding: 2px 6px; border: 1px dotted var(--p-dim);
      background: transparent; cursor: pointer; font-family: inherit; color: var(--p-ink); }
    .annotations .ann-filter[data-active="true"] { background: var(--p-accent); color: var(--p-bg);
      border-color: var(--p-accent); }
    .annotations .ann-list { list-style:none; padding: 0; margin: 0; }
    .annotations .ann-row { padding: 6px 0; border-bottom: 1px dotted var(--p-dim); }
    .annotations .ann-row .ann-head { display:flex; gap:8px; font-family: 'IBM Plex Mono', monospace;
      font-size: 11px; }
    .annotations .ann-row .ann-id { color: var(--p-accent); }
    .annotations .ann-row .ann-status { color: var(--p-dim); }
    .annotations .ann-row .ann-sev { color: var(--p-dim); }
    .annotations .ann-row .ann-target { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
      color: var(--p-dim); margin: 2px 0; }
    .annotations .ann-empty { color: var(--p-dim); padding: 8px 0; }
    .annotation-controls { display: flex; gap: 6px; margin-top: 8px; }
    .annotation-controls button { flex: 1; min-width: 0; }
    .annotations .annotation-controls .primary { background: var(--p-ink); color: var(--p-paper); font-weight: 600; }
    .annotations .annotation-controls .primary:hover { background: var(--p-ink2); }
    .annotations .ann-table-toggle { flex-shrink: 0; font: 10px 'IBM Plex Mono', monospace;
      letter-spacing: 0; text-transform: none; padding: 2px 5px; }
    .annotations .ann-note { font-size: 11.5px; margin: 3px 0 6px; color: var(--p-ink); }
    .annotations .ann-actions { display:flex; gap: 6px; }
    .annotations .ann-actions.terminal { color: var(--p-dim); font-family: 'IBM Plex Mono', monospace;
      font-size: 11px; }
    .annotations .btn { font-size: 11px; padding: 3px 8px; border: 1px solid var(--p-dim);
      background: transparent; cursor: pointer; font-family: inherit; color: var(--p-ink); }
    .annotations .btn:hover { background: var(--p-dim); color: var(--p-bg); }
    .annotations .btn.verify { border-color: var(--p-accent); color: var(--p-accent); }
    .annotations .btn.verify:hover { background: var(--p-accent); color: var(--p-bg); }

    .pt-transport { position: absolute; bottom: 14px; left: 14px; right: 14px;
      width: fit-content; margin: 0 auto; box-sizing: border-box;
      display: flex; gap: 6px; align-items: center; background: var(--p-bg);
      border: 0.75px solid var(--p-ink); padding: 6px 10px; font-size: 10px;
      font-family: 'IBM Plex Mono', monospace; letter-spacing: .1em; z-index: 5; }
    .pt-transport button { background: transparent; color: var(--p-ink);
      border: 0.5px solid var(--p-ink); font-family: inherit; font-size: 11px;
      padding: 2px 7px; cursor: pointer; text-transform: uppercase; letter-spacing: 0; }
    .pt-transport .icon-button { padding: 0; width: 28px; font-size: 18px; }
    .pt-transport .pt-play { min-width: 56px; }
    .pt-transport button:hover { background: var(--p-ink); color: var(--p-bg); }
    .pt-transport input[type=range] { width: clamp(80px, 20vw, 260px); min-width: 0; margin: 0; accent-color: var(--p-accent); }
    .pt-transport select { background: var(--p-bg); color: var(--p-ink);
      border: 0.5px solid var(--p-ink); font-family: inherit; font-size: 10px; padding: 1px 4px; letter-spacing: 0; }
    .pt-status { display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      margin-top: 4px; width: 100%; flex-basis: 100%; text-align: center; color: var(--p-dim);
      font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; }
    .pt-status b { color: var(--p-ink); font-weight: 600; }
    .pt-count { margin-left: 6px; }

    .shape-block.pt-flash-src { stroke: var(--p-indigo) !important; stroke-width: 2.6 !important;
      filter: drop-shadow(0 0 8px var(--p-indigo)); } /* gap 64 */
    .shape-block.pt-flash-dst { stroke: var(--p-accent) !important; stroke-width: 2.6 !important;
      filter: drop-shadow(0 0 10px var(--p-accent)); }
    .shape-edge.pt-flash { stroke: var(--p-accent) !important; stroke-width: 2.4 !important;
      filter: drop-shadow(0 0 6px var(--p-accent)); opacity: 1 !important; }

    .heat-toggle { display: inline-flex; align-items: center; gap: 4px;

    .heat-toggle input:disabled + * { opacity: .5; }
    .heat-ramp { font-size: 10px; color: var(--p-dim); }
    /* gap 28: split inspection stays within the viewport. */
    .detail-wrap { flex: none; min-height: 100px; max-height: 75%; display: flex; flex-direction: column; }
    #detail-splitter { height: 6px; flex: none; cursor: ns-resize; background: var(--p-paper3); touch-action: none; }

<body>
  <button id="theme-toggle" title="Toggle light / dark theme" aria-label="Theme" aria-pressed="false"><span aria-hidden="true">☀</span></button>
  <div id="app">loading…</div>
  <script>
  (function(){
    var qp = new URLSearchParams(location.search);
    var urlTheme = qp.get('theme');
    var saved = urlTheme || localStorage.getItem('cxc-theme');
    // gap 58: explicit light overrides the legacy dark default.
    if (saved !== 'light') document.body.classList.add('theme-dark');
    if (qp.get('hide-sidebar') === '1') document.body.classList.add('hide-sidebar');
    if (qp.get('hide-chrome')  === '1') document.body.classList.add('hide-chrome');
    if (qp.get('shape-only')   === '1' || (qp.get('shape') && !qp.get('trace')))
      document.body.classList.add('shape-only');
    function paint(){
      var tb = document.getElementById('theme-toggle');
      if (!tb) return;
      var dark = document.body.classList.contains('theme-dark');
      tb.setAttribute('aria-pressed', String(dark));
      tb.querySelector('span').textContent = dark ? '☾' : '☀';
    }
    document.addEventListener('DOMContentLoaded', function(){
      var tb = document.getElementById('theme-toggle');
      tb.addEventListener('click', function(){
        var dark = document.body.classList.toggle('theme-dark');
        localStorage.setItem('cxc-theme', dark ? 'dark' : 'light');
        paint();
      });
      paint();
    });
  })();
  </script>
  <script src="vendor/elk.bundled.js"></script>
  <script src="shape-canvas.js"></script>
  <script src="./dist/trace-viewer-v2.js"></script>
</body>
